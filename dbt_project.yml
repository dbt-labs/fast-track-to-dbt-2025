
name: 'fast_track_to_dbt'
version: '1.0.0'
config-version: 2

# Profile used by dbt
profile: 'default'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Output directory
target-path: "target"

# Directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  fast_track_to_dbt:
    +static_analysis: strict

    # Materialize models in models/marts/ as tables
    marts:
      +materialized: table

