version: 2

models:
  - name: customer_order_ranking
    description: >-
      One row per customer from dim_customers, retaining all customer attributes
      and ranking customers by their lifetime order count from fct_orders.
      Includes all order statuses and customers with no orders. Equal order
      counts share a rank, with gaps after ties (competition ranking).
    columns:
      - name: customer_id
        description: Unique identifier of the customer from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero for customers with no orders.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Competition rank by total_orders descending; rank 1 has the most orders and ties share a rank.
        data_tests:
          - not_null
