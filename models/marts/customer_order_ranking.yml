version: 2

models:
  - name: customer_order_ranking
    description: >
      Rankt alle Kunden nach Anzahl ihrer Aufträge (absteigend).
      Kunden mit gleicher Auftragsanzahl erhalten denselben Rang (rank()).
    columns:
      - name: order_rank
        description: Rang des Kunden nach Anzahl Aufträge (1 = meiste Aufträge).
        data_tests:
          - not_null
      - name: customer_id
        description: Primärschlüssel des Kunden.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: number_of_orders
        description: Gesamtzahl der Aufträge des Kunden.
        data_tests:
          - not_null
