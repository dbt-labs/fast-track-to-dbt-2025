version: 2

models:
  - name: dim_customers
    description: >
      One row per customer, including customers who have never placed an order.
      Enriches customer names with first and most recent order dates and a count
      of all orders, without filtering by order status.
    columns:
      - name: customer_id
        description: Unique identifier for the customer; the primary key of this model.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as recorded in the application.
      - name: last_name
        description: Customer's last name as recorded in the application.
      - name: first_order_date
        description: Earliest order date for the customer; null when the customer has no orders.
      - name: most_recent_order_date
        description: Latest order date for the customer; null when the customer has no orders.
      - name: number_of_orders
        description: Count of all orders for the customer across all statuses; zero when the customer has no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      One row per order from stg_orders, with the customer identifier, order date,
      and application status. No order statuses are filtered out.
    columns:
      - name: order_id
        description: Unique identifier for the order; the primary key of this model.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; joins to dim_customers.customer_id.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed, as recorded in the application.
      - name: status
        description: Current application status of the order, passed through from stg_orders.
