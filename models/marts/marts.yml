version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for customer-level reporting and order activity analysis,
      with one row per customer from stg_customers. Includes customer names,
      lifetime order counts, and first and most recent order dates from stg_orders
      across all order statuses. Customers with no orders are retained with a
      zero order count and null order dates.
    columns:
      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of the customer's first order; null for customers with no orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers with no orders.
      - name: number_of_orders
        description: Lifetime count of orders across all statuses; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >-
      Order fact model for reporting order volumes by customer, date, and status,
      with one row per order from stg_orders. Retains the order identifier,
      customer identifier, order date, and status without filtering order
      statuses. Join to dim_customers on customer_id for customer attributes.
    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current order status, passed through from the source.

  - name: customer_order_ranking
    description: >-
      Customer-level ranking for identifying customers with the highest lifetime
      order volumes. Contains one row per customer from dim_customers, retaining
      all customer attributes and adding an order count from fct_orders and a
      descending competition rank. Includes all order statuses and customers
      with no orders, whose order count is zero. Rank 1 represents the highest
      order count; equal counts share a rank, with gaps after ties.
    columns:
      - name: customer_id
        description: Unique identifier of the customer from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero for customers with no orders.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Competition rank by total_orders descending; rank 1 has the most orders and ties share a rank.
        data_tests:
          - not_null
