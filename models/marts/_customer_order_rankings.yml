version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by total number of orders
      across all order statuses. Includes customers with zero orders. Equal
      order counts share a rank, with no gaps between ranks.
    data_tests:
      - expression_is_true:
          name: customer_order_rankings_positive_rank
          arguments:
            expression: "order_count_rank >= 1"
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name from dim_customers.
      - name: last_name
        description: Customer's last name from dim_customers.
      - name: first_order_date
        description: Date of the customer's first order; null for customers without orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers without orders.
      - name: number_of_orders
        description: Total order count from dim_customers, including all order statuses.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Dense rank by number_of_orders descending; rank 1 has the most orders.
        data_tests:
          - not_null
