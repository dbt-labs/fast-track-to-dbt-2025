version: 2

models:
  - name: customer_rankings
    description: >-
      One row per customer from dim_customers, ranked by lifetime order count
      from fct_orders across all order statuses. Includes customers with no
      orders at zero. Equal order counts share a dense rank, with rank 1
      representing the highest order count and no gaps between ranks.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date recorded in dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, retained unchanged.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, across all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: customer_rank
        description: Dense rank by total_orders descending; tied counts share a rank and the highest count receives rank 1.
        data_tests:
          - not_null
