models:
  - name: fct_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']

  - name: dim_customers
    description: One row per customer, including customers without orders.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: first_order_date
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"
      - name: most_recent_order_date
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"
      - name: number_of_orders
        data_tests:
          - not_null

  - name: customer_order_ranks
    description: One row per customer, ranked by total order count.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: total_orders
        data_tests:
          - not_null
      - name: customer_order_rank
        data_tests:
          - unique
          - not_null
