version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for analyzing ordering history, with one row per customer
      from stg_customers. Includes customer names, first and most recent order
      dates, and an all-time count of non-null order IDs from stg_orders across
      all statuses, without filtering for completed orders. Customers without
      orders are retained with a zero order count and null order dates.
    columns:
      - name: customer_id
        description: >-
          Primary key of the customer dimension, passed through from stg_customers.
          Use to join customer attributes to fct_orders and customer_order_rankings.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name, passed through unchanged from stg_customers.
      - name: last_name
        description: Customer's last name, passed through unchanged from stg_customers.
      - name: first_order_date
        description: >-
          Earliest non-null order_date for the customer in stg_orders, across all
          statuses. Null when the customer has no orders or no non-null order dates.
      - name: most_recent_order_date
        description: >-
          Latest non-null order_date for the customer in stg_orders, across all
          statuses. Null when the customer has no orders or no non-null order dates.
      - name: number_of_orders
        description: >-
          Count of non-null order IDs for the customer in stg_orders across all
          statuses, with zero for customers without orders. This is not a distinct
          count and does not filter for completed orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >-
      Order fact table for order-volume, status, and customer-order analysis,
      with one row per order from stg_orders. Passes through the order ID,
      customer ID, order date, and status without filtering or aggregation.
      Includes all order statuses; analyses requiring completed orders must
      apply their own status filter.

    columns:
      - name: order_id
        description: Primary key of the order fact table, passed through unchanged from stg_orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: >-
          Customer associated with the order, passed through from stg_orders.
          Joins to dim_customers.customer_id for customer attributes and ordering history.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: >-
          Date of the order as supplied by stg_orders, with no date transformation.
          Used to calculate first and most recent order dates in dim_customers.
      - name: status
        description: >-
          Order status passed through unchanged from stg_orders. The model retains
          all statuses; apply a status filter when analyzing a specific order outcome.

