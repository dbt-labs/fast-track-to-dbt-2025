version: 2

models:
  - name: fct_orders
    description: Order-level fact table for analyzing order lifecycle and customer purchasing activity. One row per order.
    columns:
      - name: order_id
        description: Unique identifier for the order and the primary key of this fact table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; joins to `dim_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current lifecycle status of the order.
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: dim_customers
    description: Customer dimension enriched with lifetime order activity. One row per customer, including customers with no orders.
    columns:
      - name: customer_id
        description: Unique identifier for the customer and the primary key of this dimension.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name.
      - name: last_name
        description: Customer's family name.
      - name: first_order_date
        description: Date of the customer's earliest recorded order; null when the customer has not placed an order.
      - name: most_recent_order_date
        description: Date of the customer's latest recorded order; null when the customer has not placed an order.
      - name: number_of_orders
        description: Lifetime count of recorded orders for the customer; zero for customers with no orders.
        data_tests:
          - not_null

  - name: customer_order_ranks
    description: Customer order-volume ranking for identifying the most frequent purchasers. One row per customer, ranked by lifetime order count with customer ID as the deterministic tie-breaker.
    columns:
      - name: customer_id
        description: Unique identifier for the ranked customer; joins to `dim_customers`.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: number_of_orders
        description: Lifetime count of recorded orders used to calculate the customer ranking.
      - name: customer_order_rank
        description: Customer's rank by lifetime order count in descending order; customer ID breaks ties deterministically.
        data_tests:
          - unique
          - not_null
