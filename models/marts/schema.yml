version: 2

models:
  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        description: Unique identifier for the order from the source ordering system.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; joins to `dim_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date on which the customer placed the order.
        data_tests:
          - not_null
      - name: status
        description: Current lifecycle status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "completed",
                    "placed",
                    "return_pending",
                    "returned",
                    "shipped",
                  ]

  - name: dim_customers
    description: One record per customer, including order summary attributes.
    columns:
      - name: customer_id
        description: Unique identifier for the customer from the source customer system.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name.
      - name: last_name
        description: Customer's family name.
      - name: first_order_date
        description: Date of the customer's earliest recorded order; null when the customer has not placed an order.
      - name: most_recent_order_date
        description: Date of the customer's latest recorded order; null when the customer has not placed an order.
      - name: number_of_orders
        description: Count of orders placed by the customer, recorded as zero for customers without orders.
        data_tests:
          - not_null

  - name: customer_order_rankings
    description: One record per customer, ranked by total order count.
    columns:
      - name: customer_id
        description: Unique identifier for the ranked customer; joins to `dim_customers`.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's given name, included to make the ranking easy to consume.
      - name: last_name
        description: Customer's family name, included to make the ranking easy to consume.
      - name: total_orders
        description: Count of orders placed by the customer, including zero for customers with no orders.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank of the customer by total order count in descending order; customers with equal counts share a rank.
        data_tests:
          - not_null
