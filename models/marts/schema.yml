version: 2

models:
  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        description: Primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer that placed the order. Foreign key for the customers table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed','placed', 'return_pending', 'returned', 'shipped']

  - name: dim_customers
    description: One record per customer with lifetime order activity.
    columns:
      - name: customer_id
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
        data_tests:
          - not_null
      - name: last_name
        description: Customer's last name.
        data_tests:
          - not_null
      - name: first_order_date
        description: Date of the customer's earliest recorded order; null when the customer has not placed an order.
      - name: most_recent_order_date
        description: Date of the customer's latest recorded order; null when the customer has not placed an order.

      - name: number_of_orders
        description: Total lifetime orders placed by the customer.
        data_tests:
          - not_null
