version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers without orders, with all-time order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from stg_customers.
      - name: last_name
        description: Customer last name from stg_customers.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers without orders.
      - name: most_recent_order_date
        description: Most recent order date across all statuses; null for customers without orders.
      - name: number_of_orders
        description: All-time order count across all statuses, with zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order from stg_orders, including all order statuses.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status passed through from stg_orders.
