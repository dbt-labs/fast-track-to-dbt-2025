version: 2

models:
  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier for the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current lifecycle status of the order.
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']

  - name: dim_customers
    description: One record per customer, enriched with order history.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Total number of orders placed by the customer.
        data_tests:
          - not_null

  - name: customer_order_rankings
    description: One record per customer, ranked by total order count.
    columns:
      - name: customer_id
        description: Unique identifier for the ranked customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Total number of orders used to determine ranking.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Unique rank ordered by total order count and customer identifier.
        data_tests:
          - unique
          - not_null
