version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension for customer-level reporting, with one row per customer
      from stg_customers. Includes customer names, first and most recent order
      dates, and a count of non-null order IDs from stg_orders across all dates
      and statuses. Customers without matching orders are retained with a zero
      order count and null order dates.
    columns:
      - name: customer_id
        description: Customer identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers without orders.
      - name: most_recent_order_date
        description: Most recent order date; null for customers without orders.
      - name: number_of_orders
        description: Number of orders across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Order fact table for order-volume and status reporting, with one row per
      order from stg_orders. Exposes the order identifier, customer identifier,
      order date, and source-system status without filtering dates or statuses.
      Use customer_id to join to dim_customers for customer attributes.

    columns:
      - name: order_id
        description: Order identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order; references dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status from the source system.
