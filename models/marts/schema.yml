models:
  - name: dim_customers
    description: One record per customer with order activity aggregated from the orders mart.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        data_tests:
          - not_null

  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null

  - name: customer_order_ranking
    description: One record per customer, ranked by descending order count.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        data_tests:
          - not_null
      - name: order_count_rank
        data_tests:
          - not_null
