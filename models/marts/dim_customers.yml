version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers without orders, with lifetime order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: First order date, null for customers without orders.
      - name: most_recent_order_date
        description: Most recent order date, null for customers without orders.
      - name: number_of_orders
        description: Lifetime order count across all statuses, or zero for customers without orders.
        data_tests:
          - not_null
