version: 2

models:
  - name: dim_customers
    description: One row per customer, with first/most recent order dates and lifetime order count.
    columns:
      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Count of orders placed by the customer; zero for customers with no orders.
        data_tests:
          - not_null
