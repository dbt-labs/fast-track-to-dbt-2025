version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for analyzing customer order history, with one row per
      customer from stg_customers, including customers who have never ordered.
      Summarizes all available orders from stg_orders across all dates and
      statuses into first and most recent order dates and a lifetime order count.
      Customers without orders have null order dates and an order count of zero.

    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null for customers without orders.
      - name: number_of_orders
        description: Lifetime order count across all statuses; zero for customers without orders.
        data_tests:
          - not_null
