version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders, with order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name from stg_customers.
      - name: last_name
        description: Customer's last name from stg_customers.
      - name: first_order_date
        description: Earliest order date for the customer across all statuses; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date for the customer across all statuses; null for customers with no orders.

      - name: number_of_orders
        description: Number of orders for the customer across all statuses; zero for customers with no orders.
        data_tests:
          - not_null
