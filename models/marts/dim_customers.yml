version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders, with order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Number of orders for the customer across all statuses; zero for customers with no orders.
        data_tests:
          - not_null
