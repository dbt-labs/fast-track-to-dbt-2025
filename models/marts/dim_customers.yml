version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for customer-level reporting, with one row per customer
      from stg_customers, including customers who have never ordered. Summarizes
      all available orders from stg_orders across all statuses using order counts
      and first and most recent order dates.

    columns:
      - name: customer_id
        description: Customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from stg_customers.
      - name: last_name
        description: Customer last name from stg_customers.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null for customers with no orders.
      - name: number_of_orders
        description: Count of orders across all statuses; zero for customers with no orders.
        data_tests:
          - not_null
