version: 2

models:
  - name: dim_customers
    description: One row per customer, with first and most recent order dates and a lifetime order count.
    columns:
      - name: customer_id
        description: Customer identifier; the primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Date of the customer's first order. Null for customers without orders.
      - name: most_recent_order_date
        description: Date of the customer's latest order. Null for customers without orders.
      - name: number_of_orders
        description: Count of orders across all statuses. Zero for customers without orders.
        data_tests:
          - not_null
