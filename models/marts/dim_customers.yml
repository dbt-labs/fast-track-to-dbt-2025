version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers without orders, with order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name as recorded in stg_customers, without additional transformation.
      - name: last_name
        description: Customer last name as recorded in stg_customers, without additional transformation.
      - name: first_order_date
        description: Earliest order_date in stg_orders for this customer across all statuses; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order_date in stg_orders for this customer across all statuses; null for customers without orders.

      - name: number_of_orders
        description: Number of orders for the customer across all statuses, or zero for customers without orders.
        data_tests:
          - not_null
