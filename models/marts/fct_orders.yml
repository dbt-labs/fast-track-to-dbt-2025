version: 2

models:
  - name: fct_orders
    description: One row per order, including its customer, order date, and status.
    columns:
      - name: order_id
        description: Order identifier and primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order. Foreign key to customers table.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: Date of the order, passed through from stg_orders.
      - name: status
        description: Order status from stg_orders, retained without filtering or recoding.
