version: 2

models:
  - name: fct_orders
    description: Eine Zeile pro Auftrag.
    columns:
      - name: order_id
        description: Primärschlüssel des Auftrags.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Fremdschlüssel auf dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Datum, an dem der Auftrag aufgegeben wurde.
        data_tests:
          - not_null
      - name: status
        description: Aktueller Status des Auftrags.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
