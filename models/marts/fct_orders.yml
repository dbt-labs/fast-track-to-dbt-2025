version: 2

models:
  - name: fct_orders
    description: One row per order from stg_orders, preserving all source order statuses.
    columns:
      - name: order_id
        description: Unique order identifier from stg_orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed, from stg_orders.
      - name: status
        description: Order status from stg_orders.
