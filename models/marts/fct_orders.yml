version: 2

models:
  - name: fct_orders
    description: One row per order, including its customer, order date, and status.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
      - name: status
