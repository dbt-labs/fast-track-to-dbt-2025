version: 2

models:
  - name: fct_orders
    description: >-
      Order-level fact model with one row per order from raw.jaffle_shop.orders.
      Includes the order identifier, the customer who placed the order, the order
      date, and the order status. Retains all source orders without filtering or
      aggregation, supporting order-volume and status analysis over time and by
      customer.
    columns:
      - name: order_id
        description: Unique identifier for an order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Order status, using the same accepted values as the raw orders source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
