version: 2

models:
  - name: fct_orders
    description: One row per order from stg_orders, retaining all order statuses.
    columns:
      - name: order_id
        description: Order identifier from stg_orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order, referencing dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date of the order as recorded in stg_orders, without additional transformation.
      - name: status
        description: Order status passed through from stg_orders without filtering; expected values are placed, shipped, completed, return_pending, and returned.

