version: 2

models:
  - name: fct_orders
    description: One row per order, including the customer, order date, and status.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order; references dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status; accepted values and completeness are tested on the orders source.
