version: 2

models:
  - name: customer_order_rankings
    description: >-
      Customer-level ranking model for comparing customers by order frequency,
      with one row per customer from dim_customers and all of its columns
      preserved. Counts distinct non-null order IDs from fct_orders across all
      available dates and statuses, assigning zero to customers without orders.
      Ranks the full customer population by this count in descending order using
      a dense rank; equal counts share a rank, rank 1 represents the highest
      count, and there are no gaps between ranks.

    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: All-time count of distinct non-null order IDs in fct_orders for this customer, including all statuses.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Dense rank by total_orders descending; tied counts share a rank and the highest count is rank 1.
        data_tests:
          - not_null
