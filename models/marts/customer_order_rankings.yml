version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer in dim_customers, preserving its columns and ranking
      customers by their total number of orders from fct_orders across all dates
      and statuses. Customers without orders have zero total_orders. Equal order
      counts share a dense rank, with rank 1 representing the most orders and
      no gaps between ranks. Query with an explicit order by to sort results.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name inherited from dim_customers.
      - name: last_name
        description: Customer last name inherited from dim_customers.
      - name: first_order_date
        description: First order date inherited unchanged from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date inherited unchanged from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count inherited unchanged from dim_customers.
      - name: total_orders
        description: Count of non-null order_id values in fct_orders for this customer, including all statuses; zero when no orders exist.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; tied customers share a rank and rank 1 has the most orders.
        data_tests:
          - not_null
