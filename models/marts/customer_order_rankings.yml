version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by their lifetime order
      count from fct_orders across all statuses. Customers with no orders are
      retained with zero total_orders. Ties share a rank and leave gaps in
      subsequent ranks. All columns from dim_customers are preserved.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as reported by dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as reported by dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count preserved from dim_customers; not used for ranking.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, including all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Customer rank by total_orders descending, with rank 1 representing the highest count; ties share a rank with gaps.
        data_tests:
          - not_null
