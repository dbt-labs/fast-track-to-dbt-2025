version: 2

models:
  - name: customer_order_rankings
    description: >-
      Customer order-volume ranking for comparing customers by all-time order
      activity. One row per customer in dim_customers, ranked by their count of
      non-null order IDs in fct_orders across all order statuses. Includes
      customers with no orders and preserves all dim_customers columns.
      Equal order counts share a rank, with gaps after ties.
    data_tests:
      - expression_is_true:
          name: customer_order_rankings_valid_totals
          arguments:
            expression: total_orders >= 0 and total_orders = number_of_orders
      - expression_is_true:
          name: customer_order_rankings_positive_rank
          arguments:
            expression: order_rank >= 1

    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: >-
          Count of non-null order IDs in fct_orders for this customer across
          all statuses; zero for customers with no orders. Used to calculate order_rank.
        data_tests:
          - not_null
      - name: order_rank
        description: >-
          Rank by total_orders descending, with rank 1 representing the most
          orders. Equal counts share a rank, with gaps after ties (1, 1, 3).
        data_tests:
          - not_null
      - name: first_name
        description: Customer's first name inherited from dim_customers.
      - name: last_name
        description: Customer's last name inherited from dim_customers.
      - name: first_order_date
        description: Earliest order date across all statuses, inherited from dim_customers; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses, inherited from dim_customers; null for customers without orders.
      - name: number_of_orders
        description: Count of non-null order IDs across all statuses in stg_orders, inherited from dim_customers; zero for customers without orders.
