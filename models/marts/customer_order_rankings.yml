version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by their all-time order
      count from fct_orders across all order statuses. Customers without orders
      have total_orders of zero. Equal order counts share a dense rank, with
      rank 1 representing the highest count and no gaps between ranks.
      Retains all columns from dim_customers.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as calculated in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as calculated in dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count retained from dim_customers.
      - name: total_orders
        description: Count of order IDs in fct_orders for this customer, including all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Dense rank by total_orders descending; ties share a rank and rank 1 has the most orders.
        data_tests:
          - not_null
