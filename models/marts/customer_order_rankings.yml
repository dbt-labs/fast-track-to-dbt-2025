version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by the all-time distinct
      order count from fct_orders across all statuses. Customers without orders
      have a total of zero. Equal totals share a dense rank, with rank 1 having
      the most orders and no gaps between ranks.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count retained from dim_customers.
      - name: total_orders
        description: All-time distinct order count from fct_orders, including all statuses.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank by total_orders descending; ties share a rank, starting at 1.
        data_tests:
          - not_null
