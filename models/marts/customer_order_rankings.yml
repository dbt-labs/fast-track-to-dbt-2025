version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by lifetime order count
      from fct_orders across all order statuses. Customers without orders are
      included with zero orders. Equal counts share a rank, with gaps after ties.
      Order query results by order_rank and customer_id for leaderboard display.
      Existing dim_customers columns are retained unchanged.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer; zero when there are no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Customer rank by total_orders descending, starting at one; ties share a rank with gaps afterward.
        data_tests:
          - not_null
