version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer in dim_customers, ranked by all orders in fct_orders
      across all dates and statuses. Preserves all dim_customers columns.
      Customers without orders have total_orders of zero. Ties share a rank,
      with gaps after ties (SQL RANK semantics); rank 1 has the most orders.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name inherited from dim_customers.
      - name: last_name
        description: Customer's last name inherited from dim_customers.
      - name: first_order_date
        description: Earliest order date across all statuses, inherited from dim_customers; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses, inherited from dim_customers; null for customers without orders.
      - name: number_of_orders
        description: Lifetime order count inherited from dim_customers, based on stg_orders across all statuses; zero for customers without orders.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, across all statuses and dates.
        data_tests:
          - not_null
          - minimum_value:
              arguments:
                min_value: 0
      - name: order_rank
        description: Descending rank by total_orders; equal counts share a rank, with gaps after ties.
        data_tests:
          - not_null
          - minimum_value:
              arguments:
                min_value: 1
