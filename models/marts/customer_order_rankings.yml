version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by their total number of
      orders in fct_orders across all dates and statuses. Customers without orders
      are included with zero orders. Equal order totals share a rank, with gaps
      after ties (competition ranking).
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the grain of this model.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date recorded in dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, preserved for reference.
      - name: total_orders
        description: Count of order IDs in fct_orders for this customer, defaulting to zero.
        data_tests:
          - not_null
      - name: order_rank
        description: >
          Competition rank by total_orders descending, starting at 1 for the
          highest order count. Tied totals share a rank, with gaps after ties.
        data_tests:
          - not_null
