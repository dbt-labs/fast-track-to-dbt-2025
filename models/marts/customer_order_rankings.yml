version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by the all-time number
      of orders in fct_orders across all statuses. Customers without orders
      are included with zero orders. Equal totals share a dense rank.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date recorded in dim_customers.
      - name: number_of_orders
        description: Existing staging-derived order count preserved from dim_customers.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, or zero when none exist.
        data_tests:
          - not_null
      - name: order_count_rank
        description: >
          Dense rank by total_orders descending. Rank 1 has the most orders;
          tied totals share a rank, and subsequent ranks have no gaps.
        data_tests:
          - not_null
