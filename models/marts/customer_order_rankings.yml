version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by total orders in
      fct_orders across all dates and statuses. Includes customers with zero
      orders and preserves all dim_customers columns. Equal order counts share
      a rank, with gaps after ties (for example, 1, 1, 3).
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as defined in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as defined in dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers; not used for ranking.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, or zero if none.
        data_tests:
          - not_null
      - name: order_rank
        description: Descending rank by total_orders; rank 1 is highest, and ties share a rank.
        data_tests:
          - not_null
