version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all dates and statuses. Includes customers
      with zero orders and preserves all dim_customers columns. Equal order
      counts share a dense rank, with the highest count ranked first.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date from dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, retained unchanged.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending. Ties share a rank and ranks have no gaps.
        data_tests:
          - not_null
