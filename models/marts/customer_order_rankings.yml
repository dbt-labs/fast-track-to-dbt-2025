version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer in dim_customers, ranked by all-time order count
      from fct_orders across all order statuses. Customers without orders
      have zero orders. Equal counts share a rank, with gaps after ties.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date retained from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date retained from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count retained from dim_customers.
        data_tests:
          - not_null

      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, or zero.
        data_tests:
          - not_null
      - name: order_rank
        description: Descending rank by total_orders; equal counts share a rank, with gaps after ties.
        data_tests:
          - not_null
