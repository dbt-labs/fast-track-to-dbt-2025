version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all dates and statuses. Includes customers
      with no orders. All existing dim_customers columns are retained;
      total_orders is calculated independently from fct_orders.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending, starting at 1. Equal counts share a rank, with no gaps between ranks.
        data_tests:
          - not_null
