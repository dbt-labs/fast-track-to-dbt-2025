version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all dates and statuses. Customers without
      orders are included with zero orders. Equal order counts share a dense
      rank, with rank 1 representing the highest count.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date recorded in dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, preserved for context.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, or zero when there are none.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank by total_orders descending; ties share a rank with no gaps between ranks.
        data_tests:
          - not_null
