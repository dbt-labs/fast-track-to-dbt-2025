version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by all-time order count
      from fct_orders across all statuses. Includes customers with no orders.
      Preserves all dim_customers columns. Equal order counts share a dense
      rank, with no gaps between ranks; rank 1 has the most orders.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when there are no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; equal counts share a rank and rank 1 is highest.
        data_tests:
          - not_null
