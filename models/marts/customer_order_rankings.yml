version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer in dim_customers, ranked by total orders from
      fct_orders across all dates and statuses. Includes customers with no
      orders. All dim_customers columns are retained; number_of_orders is
      inherited from that model, while total_orders is calculated from fct_orders.
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: first_name
        description: Customer's first name inherited from dim_customers.
      - name: last_name
        description: Customer's last name inherited from dim_customers.
      - name: first_order_date
        description: Earliest order date across all statuses, inherited from dim_customers; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses, inherited from dim_customers; null for customers with no orders.
      - name: number_of_orders
        description: Order count across all statuses inherited from dim_customers; zero for customers with no orders.


      - name: total_orders
        description: Number of orders in fct_orders for this customer; zero if none.
        data_tests:
          - not_null
      - name: order_rank
        description: >
          Customer rank by total_orders descending, starting at 1. Equal totals
          share a rank, with gaps after ties (for example, 1, 1, 3).
        data_tests:
          - not_null
