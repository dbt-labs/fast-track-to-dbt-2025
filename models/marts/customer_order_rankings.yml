version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer in dim_customers, ranked by their all-time order
      count from fct_orders across all order statuses. Includes customers with
      no orders. Preserves all dim_customers columns.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: >-
          Count of non-null order IDs in fct_orders for this customer;
          zero for customers with no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: >-
          Rank by total_orders descending, with rank 1 representing the most
          orders. Equal counts share a rank, with gaps after ties (1, 1, 3).
        data_tests:
          - not_null
