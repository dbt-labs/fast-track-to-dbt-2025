version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, retaining all customer attributes
      and ranking customers by their all-time number of orders in fct_orders.
      All order statuses are included. Customers without orders have zero orders.
      Equal order counts share a rank, with gaps after ties (1, 1, 3).
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, including all statuses.
        data_tests:
          - not_null
      - name: customer_rank
        description: Descending rank by total_orders; rank 1 is the highest order count. Ties share a rank.
        data_tests:
          - not_null
