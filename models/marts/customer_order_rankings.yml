version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by lifetime order count
      from fct_orders across all statuses. Includes customers with zero orders
      and preserves all dim_customers columns. Tied counts share a rank, with
      gaps after ties (for example, 1, 1, 3).
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: first_name
        description: Customer first name inherited from dim_customers.
      - name: last_name
        description: Customer last name inherited from dim_customers.
      - name: first_order_date
        description: First order date inherited from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date inherited from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count inherited from dim_customers; not used for ranking.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, across all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Rank by total_orders descending, starting at 1; equal counts share a rank and subsequent ranks have gaps.
        data_tests:
          - not_null
