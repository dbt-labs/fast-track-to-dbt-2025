version: 2

models:
  - name: customer_order_rankings
    description: >
      Customer order-volume leaderboard with one row per customer from
      dim_customers, retaining customer names and order-history attributes.
      Calculates total_orders as the count of non-null order IDs in fct_orders
      across all dates and statuses, including customers without orders with a
      zero count. Ranks customers by total_orders descending using dense rank:
      equal counts share a rank, ranks have no gaps, and rank 1 represents the
      highest order count. The number_of_orders field from dim_customers is
      retained separately and is not used to calculate the rank.

    columns:
      - name: customer_id
        description: Customer identifier and primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date from dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, retained for compatibility; not used for ranking.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, including all statuses; zero if there are no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; ties share a rank and the highest count has rank 1.
        data_tests:
          - not_null
