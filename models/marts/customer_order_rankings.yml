version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer in dim_customers, ranked by total orders from
      fct_orders across all dates and statuses. Customers without orders are
      included with zero orders. Ties share a dense rank, with no gaps.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date recorded in dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, retained unchanged.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, or zero when none exist. Includes all order statuses.
        data_tests:
          - not_null
      - name: customer_rank
        description: Dense rank by total_orders descending; rank 1 has the most orders, and ties share a rank.
        data_tests:
          - not_null
