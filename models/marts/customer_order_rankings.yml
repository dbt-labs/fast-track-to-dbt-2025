version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer in dim_customers, ranked by the total number of orders
      in fct_orders across all dates and statuses. Customers with no orders are
      included with zero orders. Equal totals share a rank, with gaps after ties.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date retained from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date retained from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count retained from dim_customers; not used for ranking.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, including all statuses; zero when there are no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Rank by total_orders descending, starting at one. Equal totals share a rank, with gaps after ties.
        data_tests:
          - not_null
