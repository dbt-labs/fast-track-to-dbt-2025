version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all dates and statuses. Customers without
      orders are included with zero total_orders. Equal totals share a dense
      rank, with rank 1 representing the highest order count.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as provided by dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as provided by dim_customers.
      - name: number_of_orders
        description: Existing staging-derived order count retained from dim_customers.
      - name: total_orders
        description: Count of non-null order_id values in fct_orders for this customer, across all dates and statuses; zero when there are no orders.
        data_tests:
          - not_null
      - name: customer_rank
        description: Dense rank by total_orders descending. Ties share a rank and subsequent ranks have no gaps.
        data_tests:
          - not_null
