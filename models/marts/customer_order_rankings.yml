version: 2

models:
  - name: customer_order_rankings
    description: >-
      Customer ranking mart for comparing order activity, with one row per customer
      from dim_customers. Retains all customer dimension columns and adds an order
      count from fct_orders across all statuses plus a descending dense rank.
      Customers without orders are retained with total_orders set to zero.
      Equal totals share a rank, with no gaps between ranks. Consumers should
      order by order_rank and customer_id when displaying a ranked list.
    data_tests:
      - valid_expression:
          name: customer_order_rankings_has_valid_counts_and_ranks
          arguments:
            expression: >-
              total_orders >= 0
              and total_orders = floor(total_orders)
              and order_rank >= 1
              and order_rank = floor(order_rank)

    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers; the primary key at the customer grain.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name passed through from dim_customers without additional transformation.
      - name: last_name
        description: Customer last name passed through from dim_customers without additional transformation.
      - name: first_order_date
        description: Earliest order date computed by dim_customers from stg_orders across all statuses; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date computed by dim_customers from stg_orders across all statuses; null for customers without orders.
      - name: number_of_orders
        description: Staging-based count inherited from dim_customers; retained for context and not used to calculate order_rank.
      - name: total_orders
        description: Count of non-null order_id values in fct_orders for the customer across all statuses; zero without orders. This count determines order_rank.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending, starting at 1 for the highest total. Equal totals share a rank, and the next distinct total receives the next consecutive rank.
        data_tests:
          - not_null


unit_tests:
  - name: customer_order_rankings_handles_ties_and_zero_orders
    description: >-
      Rank by fct_orders counts rather than the inherited number_of_orders.
      Tied customers share a rank without gaps, and customers without orders remain.
    model: customer_order_rankings
    given:
      - input: ref('dim_customers')
        rows:
          - {customer_id: 1, number_of_orders: 99}
          - {customer_id: 2, number_of_orders: 0}
          - {customer_id: 3, number_of_orders: 0}
          - {customer_id: 4, number_of_orders: 0}
          - {customer_id: 5, number_of_orders: 0}
      - input: ref('fct_orders')
        rows:
          - {order_id: 101, customer_id: 1}
          - {order_id: 102, customer_id: 1}
          - {order_id: 103, customer_id: 1}
          - {order_id: 201, customer_id: 2}
          - {order_id: 202, customer_id: 2}
          - {order_id: 301, customer_id: 3}
          - {order_id: 302, customer_id: 3}
          - {order_id: 401, customer_id: 4}
    expect:
      rows:
        - {customer_id: 1, total_orders: 3, order_rank: 1}
        - {customer_id: 2, total_orders: 2, order_rank: 2}
        - {customer_id: 3, total_orders: 2, order_rank: 2}
        - {customer_id: 4, total_orders: 1, order_rank: 3}
        - {customer_id: 5, total_orders: 0, order_rank: 4}

  - name: customer_order_rankings_handles_no_orders
    description: When there are no orders, every customer has zero orders and rank one.
    model: customer_order_rankings
    given:
      - input: ref('dim_customers')
        rows:
          - {customer_id: 1}
          - {customer_id: 2}
      - input: ref('fct_orders')
        rows: []
    expect:
      rows:
        - {customer_id: 1, total_orders: 0, order_rank: 1}
        - {customer_id: 2, total_orders: 0, order_rank: 1}
