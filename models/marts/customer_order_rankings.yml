version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by total orders from
      fct_orders across all dates and statuses. Customers with no orders are
      included with zero total_orders. Equal totals share a dense rank,
      with rank 1 representing the highest total and no gaps between ranks.
      Sort by order_count_rank and customer_id when displaying results.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the grain of this model.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date retained from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date retained from dim_customers.
      - name: number_of_orders
        description: Existing staging-derived order count retained from dim_customers.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, or zero if none exist.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Dense rank by total_orders descending; tied totals share a rank and rank 1 is highest.
        data_tests:
          - not_null
