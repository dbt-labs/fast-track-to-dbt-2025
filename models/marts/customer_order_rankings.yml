version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, preserving all dimension columns
      and adding an all-time order count from fct_orders across all statuses.
      Includes customers with no orders. Customers are ranked by descending
      order count using rank(): ties share a rank and subsequent ranks have gaps.
      Query with order by order_count_rank, customer_id to display the leaderboard.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as defined in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as defined in dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count preserved from dim_customers.
      - name: order_count
        description: Number of rows in fct_orders for this customer; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Descending order-count rank, starting at 1; ties share a rank with gaps afterward.
        data_tests:
          - not_null
