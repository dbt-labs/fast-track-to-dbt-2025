version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer in dim_customers, ranked by lifetime order count
      from fct_orders across all order statuses. Customers without orders
      receive a zero count. Equal counts share a rank, with gaps after ties.
      Retains all columns from dim_customers.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as defined in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as defined in dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count retained from dim_customers.
      - name: total_orders
        description: Count of orders in fct_orders for the customer, including all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Descending rank by total_orders; rank 1 has the most orders. Ties share a rank and subsequent ranks have gaps.
        data_tests:
          - not_null
