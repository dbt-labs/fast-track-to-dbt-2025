version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all dates and statuses. Customers without
      orders are included with zero orders. Equal totals share a dense rank,
      with rank 1 representing the highest order count. All dim_customers
      columns are preserved; number_of_orders retains its staging-based meaning.
      Query with order by order_rank, customer_id for a sorted leaderboard.
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: Number of non-null order IDs in fct_orders for this customer, including all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending. Ties share a rank and ranks have no gaps.
        data_tests:
          - not_null
