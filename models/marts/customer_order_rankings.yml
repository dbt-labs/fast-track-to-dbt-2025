version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by the all-time number
      of orders in fct_orders across all statuses. Includes customers with zero
      orders. Equal totals share a rank, with gaps after ties (1, 1, 3).
      Sort by order_rank and customer_id when querying for a stable display order.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the grain of this model.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as recorded in dim_customers.
      - name: number_of_orders
        description: Existing staging-derived order count preserved from dim_customers.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: order_rank
        description: Customer rank by total_orders descending; ties share a rank with gaps after ties.
        data_tests:
          - not_null
