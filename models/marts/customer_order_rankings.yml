version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, retaining all customer attributes
      and ranking customers by their lifetime order count from fct_orders.
      All order statuses are included. Customers without orders have a total
      of zero. Equal totals share a rank, with gaps after ties.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when there are no orders.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Rank by total_orders descending, starting at 1 for the highest total; ties share a rank with gaps afterward.
        data_tests:
          - not_null
