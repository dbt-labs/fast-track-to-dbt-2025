version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer in dim_customers, retaining all customer attributes
      and ranking customers by their total number of orders in fct_orders.
      All order statuses are included. Customers without orders have a total
      of zero. Equal totals share a dense rank, with no gaps between ranks.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, or zero if none.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; rank 1 has the most orders and ties share a rank.
        data_tests:
          - not_null
