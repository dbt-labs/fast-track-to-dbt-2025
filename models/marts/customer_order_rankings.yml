version: 2

models:
  - name: customer_order_rankings
    description: >
      Customer leaderboard for comparing lifetime order volume, with one row per
      customer from dim_customers. Counts orders in fct_orders across all dates
      and statuses, retaining customers without orders with zero total_orders.
      Ranks customers by total_orders descending; equal counts share a rank,
      with gaps after ties. Retains the order dates and staging-based
      number_of_orders from dim_customers alongside the fact-based total_orders.

    columns:
      - name: customer_id
        description: Customer identifier from dim_customers and the primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date recorded in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date recorded in dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count retained from dim_customers.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, including all statuses; zero when there are no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Descending rank by total_orders, with rank 1 for the highest count. Ties share a rank and subsequent ranks have gaps.
        data_tests:
          - not_null
