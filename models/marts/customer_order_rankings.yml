models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by number_of_orders
      across all dates and statuses. Customers without orders have a count of
      zero. Equal counts share a dense rank, with rank 1 representing the
      highest count and no gaps between ranks.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: first_name
        description: Customer first name inherited from dim_customers.
      - name: last_name
        description: Customer last name inherited from dim_customers.
      - name: first_order_date
        description: First order date inherited from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date inherited from dim_customers.
      - name: number_of_orders
        description: Number of orders across all statuses, inherited from dim_customers; zero for customers without orders. This is the ranking basis for order_rank.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by number_of_orders descending; ties share a rank and rank 1 has the most orders.
        data_tests:
          - not_null
