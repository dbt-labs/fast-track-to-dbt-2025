version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by their all-time order
      count from fct_orders across all statuses. Includes customers with no
      orders. Preserves all columns from dim_customers.
    data_tests:
      - expression_is_true:
          name: customer_order_rankings_valid_totals_and_rank
          description: Order totals must be nonnegative and match the dimension count; ranks must start at one or higher and may tie.
          arguments:
            expression: total_orders >= 0 and order_rank >= 1 and total_orders = number_of_orders
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: first_name
        description: Customer first name from the application, inherited from dim_customers.
      - name: last_name
        description: Customer last name from the application, inherited from dim_customers.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null for customers with no orders.
      - name: number_of_orders
        description: Count of orders across all statuses from dim_customers; zero for customers with no orders.


      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: order_rank
        description: >
          Descending rank by total_orders, starting at 1 for the most orders.
          Ties share a rank and leave gaps in subsequent ranks (1, 1, 3).
        data_tests:
          - not_null
