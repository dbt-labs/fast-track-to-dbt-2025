version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, retaining all customer attributes
      and ranking customers by their all-time order count from fct_orders.
      All order statuses are included. Customers without orders have zero orders.
      Equal order counts share a dense rank, with rank 1 representing the most orders.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the primary key of this model.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, across all statuses; zero for customers without orders.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank by total_orders descending. Ties share a rank, with no gaps between ranks.
        data_tests:
          - not_null
