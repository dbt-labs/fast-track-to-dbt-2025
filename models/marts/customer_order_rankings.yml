version: 2

models:
  - name: dim_customers
    description: Customer dimension with order activity summarized at one row per customer.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: Customer's first name.
        data_tests:
          - not_null
      - name: last_name
        description: Customer's last name.
        data_tests:
          - not_null
      - name: number_of_orders
        description: Number of orders placed by the customer.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
                quote: false

  - name: fct_orders
    description: Order fact table with one row per order.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Unique identifier for the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: customer_order_rankings
    description: Customer-level order totals ranked from highest to lowest order volume.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - not_null
          - unique
      - name: total_orders
        description: Total number of orders placed by the customer.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
                quote: false
      - name: customer_order_rank
        description: Dense rank of the customer's total orders, ordered descending.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
