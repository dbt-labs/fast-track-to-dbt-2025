version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, retaining all customer attributes
      and ranking customers by their all-time order count from fct_orders across
      all statuses. Includes customers with zero orders. Equal counts share a
      dense rank, with rank 1 representing the most orders and no gaps between ranks.
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name, inherited from dim_customers.
      - name: last_name
        description: Customer's last name, inherited from dim_customers.
      - name: first_order_date
        description: Earliest order date across all statuses, inherited from dim_customers; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses, inherited from dim_customers; null for customers with no orders.
      - name: number_of_orders
        description: All-time order count across all statuses, inherited from dim_customers; zero for customers with no orders.

      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer; zero for customers without orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; equal totals share a rank.
        data_tests:
          - not_null
