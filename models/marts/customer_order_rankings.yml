version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by all-time order count
      from fct_orders across all statuses. Customers without orders are included
      with zero total_orders. Equal totals share a rank, with gaps after ties.
      Existing customer attributes, including number_of_orders calculated by
      dim_customers from staging, are preserved unchanged.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as calculated by dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as calculated by dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count from dim_customers.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer, or zero.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Descending rank by total_orders; rank 1 is highest and ties share a rank.
        data_tests:
          - not_null
