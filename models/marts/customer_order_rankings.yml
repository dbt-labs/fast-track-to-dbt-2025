version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by lifetime order count
      from fct_orders across all order statuses. Includes customers with zero
      orders. Equal counts share a dense rank, starting at 1 for the highest
      count, without gaps between ranks. Preserves all dim_customers columns.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; customers with equal counts share a rank.
        data_tests:
          - not_null
