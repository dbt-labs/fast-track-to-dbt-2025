version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all statuses and dates. Customers with no
      orders are included with a zero count. Equal counts share a rank, with
      gaps after ties (for example, 1, 1, 3).
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date from dim_customers.
      - name: number_of_orders
        description: Existing staging-derived order count from dim_customers.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer; zero for customers with no orders.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Descending rank by total_orders; ties share a rank and subsequent ranks have gaps.
        data_tests:
          - not_null
