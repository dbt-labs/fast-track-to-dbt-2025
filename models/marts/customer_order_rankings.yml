version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer in dim_customers, ranked by the total number of
      non-null order IDs in fct_orders across all dates and statuses.
      Customers with no orders are included with zero orders. Equal totals
      share a rank, with gaps after ties. Retains all dim_customers columns;
      total_orders is calculated independently from fct_orders.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date carried through from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date carried through from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count carried through from dim_customers.
      - name: total_orders
        description: Number of orders in fct_orders for the customer, or zero if none.
        data_tests:
          - not_null
      - name: order_rank
        description: Descending rank by total_orders; rank 1 has the most orders, with gaps after ties.
        data_tests:
          - not_null
