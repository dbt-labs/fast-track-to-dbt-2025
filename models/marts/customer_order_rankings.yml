version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by lifetime order count
      from fct_orders across all statuses. Includes customers with zero orders
      and preserves all columns from dim_customers. Equal order counts share
      a dense rank, with rank 1 representing the highest count and no gaps
      between ranks. Query with ORDER BY order_rank, customer_id for display.
    columns:
      - name: customer_id
        description: Unique identifier of the customer from dim_customers.
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer; zero when there are no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; ties share a rank and rank 1 has the most orders.
        data_tests:
          - not_null
