version: 2

models:
  - name: customer_order_rankings
    description: Customer order-volume ranking, with one row per customer.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: Total number of orders placed by the customer, including cancelled and deleted orders.
      - name: customer_order_rank
        description: Dense rank of customers by total order count, where 1 is the highest count.
        data_tests:
          - not_null

  - name: dim_customers
    description: Customer dimension, with one row per customer and order-activity rollups.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: number_of_orders
        data_tests:
          - not_null

  - name: fct_orders
    description: Order fact table, with one row per order.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
