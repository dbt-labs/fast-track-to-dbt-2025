version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, preserving all customer columns
      and ranking customers by their all-time distinct order count from
      fct_orders across all statuses. Customers without orders receive zero.
      Equal order counts share a dense rank, with rank 1 representing the
      highest count and no gaps between ranks.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_orders
        description: All-time count of distinct non-null order IDs in fct_orders for this customer, including all statuses.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Dense rank by total_orders descending; tied counts share a rank and the highest count is rank 1.
        data_tests:
          - not_null
