version: 2

models:
  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by the total number of
      orders in fct_orders across all dates and statuses. Customers with no
      orders have total_orders of zero. Equal totals share a dense rank, with
      rank 1 representing the highest order count and no gaps between ranks.
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers; the primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as calculated in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as calculated in dim_customers.
      - name: number_of_orders
        description: Existing order count from dim_customers, preserved unchanged.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, or zero when none exist.
        data_tests:
          - not_null
      - name: order_count_rank
        description: Dense rank by total_orders descending; ties share a rank and the highest total is rank 1.
        data_tests:
          - not_null
