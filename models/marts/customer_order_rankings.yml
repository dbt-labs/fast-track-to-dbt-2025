version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, preserving all customer columns
      and ranking customers by their all-time number of orders in fct_orders.
      All order statuses are included. Customers with no orders have a count
      of zero. Equal counts share a dense rank, with no gaps between ranks.
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: Total number of orders for the customer, including all statuses; zero for customers with no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; rank 1 has the most orders and ties share a rank.
        data_tests:
          - not_null
