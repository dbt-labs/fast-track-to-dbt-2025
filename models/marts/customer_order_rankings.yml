version: 2

models:
  - name: customer_order_rankings
    description: >-
      One row per customer from dim_customers, preserving all customer attributes
      and ranking customers by their all-time order count from fct_orders across
      all order statuses. Includes customers with no orders. Equal order counts
      share a dense rank, starting at 1 for the highest count with no rank gaps.
    columns:
      - name: customer_id
        description: Unique customer identifier from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from dim_customers.
      - name: last_name
        description: Customer last name from dim_customers.
      - name: first_order_date
        description: First order date as defined in dim_customers.
      - name: most_recent_order_date
        description: Most recent order date as defined in dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count preserved from dim_customers.
      - name: total_orders
        description: Count of order IDs in fct_orders for this customer, or zero if none.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; ties share the same rank.
        data_tests:
          - not_null
