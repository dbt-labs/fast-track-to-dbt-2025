version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers without orders, with all-time order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from stg_customers.
      - name: last_name
        description: Customer last name from stg_customers.
      - name: first_order_date
        description: Earliest order date for the customer; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date for the customer; null for customers without orders.
      - name: number_of_orders
        description: All-time count of orders for the customer across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order from stg_orders, retaining all order statuses.
    columns:
      - name: order_id
        description: Unique order identifier from stg_orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign Key for the customers table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Order status passed through from stg_orders.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']

  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, retaining all customer attributes
      and ranking customers by their all-time order count from fct_orders.
      All order statuses are included. Customers without orders have zero orders.
      Ties share a dense rank, with rank 1 representing the highest order count.
      The inherited number_of_orders column comes from dim_customers;
      total_orders is calculated independently from fct_orders and drives the rank.
    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name inherited from dim_customers.
      - name: last_name
        description: Customer last name inherited from dim_customers.
      - name: first_order_date
        description: First order date inherited from dim_customers.
      - name: most_recent_order_date
        description: Most recent order date inherited from dim_customers.
      - name: number_of_orders
        description: Existing staging-based order count inherited from dim_customers.
        data_tests:
          - not_null
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer, across all dates and statuses; zero when no orders match.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; ties share a rank and ranks have no gaps.
        data_tests:
          - not_null
