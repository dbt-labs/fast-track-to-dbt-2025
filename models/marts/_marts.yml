version: 2

models:
  - name: dim_customers
    description: One row per customer, combining customer attributes with lifetime order activity. Customers with no orders are retained with zero orders and null order dates.
    columns:
      - name: customer_id
        description: Primary key for the customer; sourced from the raw customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name as recorded in the source application.
        data_tests:
          - not_null
      - name: last_name
        description: Customer's family name as recorded in the source application.
        data_tests:
          - not_null
      - name: first_order_date
        description: Earliest order date for the customer; null when the customer has not placed an order.
      - name: most_recent_order_date
        description: Latest order date for the customer; null when the customer has not placed an order.
      - name: number_of_orders
        description: Lifetime count of orders placed by the customer; zero when no orders exist.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, carrying the customer, order date, and current lifecycle status from the staged orders data.
    columns:
      - name: order_id
        description: Primary key for the order; sourced from the raw order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; joins to `dim_customers.customer_id`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date on which the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current lifecycle status of the order in the source application.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']

  - name: customer_order_rankings
    description: One row per customer, ranking customers by lifetime order count. Customers with no orders are retained and share the lowest dense rank.
    columns:
      - name: customer_id
        description: Primary key for the customer; joins to `dim_customers.customer_id`.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_number_of_orders
        description: Lifetime count of orders placed by the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank by lifetime order count in descending order; customers with equal counts receive the same rank.
        data_tests:
          - not_null
      - name: first_name
        description: Customer's given name as recorded in the source application.
        data_tests:
          - not_null
      - name: last_name
        description: Customer's family name as recorded in the source application.
        data_tests:
          - not_null
