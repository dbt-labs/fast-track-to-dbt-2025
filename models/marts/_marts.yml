version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension for customer-level reporting, with one row per customer
      from stg_customers. Summarizes lifetime order activity from stg_orders,
      including the first and most recent order dates and the count of non-null
      order IDs across all statuses. Customers with no orders are retained with
      a zero order count and null order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers with no orders.
      - name: number_of_orders
        description: Lifetime count of orders across all statuses; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Order fact table for order-level reporting and customer order counts, with
      one row per order from stg_orders. Includes the customer identifier, order
      date, and source status without additional filtering or aggregation. All
      source order statuses are retained, so counts are not restricted to
      completed orders.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order; must exist in dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status passed through from the source.
