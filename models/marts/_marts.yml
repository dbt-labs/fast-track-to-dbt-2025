version: 2

models:
  - name: dim_customers
    description: >-
      One row per customer, including customers with no orders. Summarizes
      order dates and order counts across all order statuses.
    columns:
      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers with no orders.
      - name: number_of_orders
        description: Count of orders across all statuses, or zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order from stg_orders, preserving all order statuses.
    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status from stg_orders.
