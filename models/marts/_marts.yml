models:
  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        description: Primary key for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current lifecycle status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']

  - name: dim_customers
    description: One record per customer, including customers without orders.
    columns:
      - name: customer_id
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name.
      - name: last_name
        description: Customer's family name.
      - name: first_order_date
        description: Date of the customer's earliest order; null when the customer has not placed an order.
      - name: most_recent_order_date
        description: Date of the customer's latest order; null when the customer has not placed an order.
      - name: number_of_orders
        description: Total number of orders placed by the customer, including zero-order customers.
        data_tests:
          - not_null

  - name: ranked_customers
    description: One record per customer with an ordinal rank by order count.
    columns:
      - name: customer_id
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's given name.
      - name: last_name
        description: Customer's family name.
      - name: number_of_orders
        description: Total number of orders placed by the customer, including zero-order customers.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Unique ordinal rank of the customer by descending order count, with customer ID used as the tie-breaker.
        data_tests:
          - unique
          - not_null
