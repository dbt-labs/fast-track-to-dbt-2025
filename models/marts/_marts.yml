version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of the customer's first order; null for customers with no orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers with no orders.

  - name: fct_orders
    description: One row per order, including all order statuses.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order lifecycle status, validated against accepted values at the source.

  - name: customer_order_rankings
    description: >-
      One row per customer with all dim_customers columns, an all-time order
      count across all statuses, and a dense rank by order count descending.
      Customers with no orders have zero orders. Ties share a rank without gaps.
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name inherited from dim_customers.
      - name: last_name
        description: Customer's last name inherited from dim_customers.
      - name: first_order_date
        description: Date of the customer's first order; null for customers with no orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers with no orders.
      - name: total_orders
        description: Number of orders across all statuses; zero for customers with no orders.
        data_tests:
          - not_null
      - name: order_rank
        description: Dense rank by total_orders descending; the largest count has rank 1 and ties share a rank.
        data_tests:
          - not_null
