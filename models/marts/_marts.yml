version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders, with lifetime order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Customer identifier; the grain of this model.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Earliest order date; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers with no orders.
      - name: number_of_orders
        description: Lifetime order count across all statuses, or zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, with its customer, order date, and status.
    columns:
      - name: order_id
        description: Order identifier; the grain of this model.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order; references dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status, validated by the source-level accepted_values test.
