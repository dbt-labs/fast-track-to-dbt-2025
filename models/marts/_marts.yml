version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers without orders, with order counts and first and most recent order dates.
    data_tests:
      - expression_is_true:
          name: dim_customers_nonnegative_order_count
          arguments:
            expression: "number_of_orders >= 0"
      - expression_is_true:
          name: dim_customers_valid_order_dates
          arguments:
            expression: >
              (number_of_orders = 0 and first_order_date is null and most_recent_order_date is null)
              or (number_of_orders > 0 and first_order_date is not null
                  and most_recent_order_date is not null and first_order_date <= most_recent_order_date)
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers without orders.
      - name: number_of_orders
        description: Number of orders across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, retaining all order statuses from staging.
    columns:
      - name: order_id
        description: Primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key for the customers table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Order status, passed through from staging and validated at the source.
