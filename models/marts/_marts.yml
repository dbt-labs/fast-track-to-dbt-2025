models:
  - name: dim_customers
    description: One record per customer, including their identifying attributes and lifetime order activity. Customers with no orders are retained with zero orders and null order dates.
    columns:
      - name: customer_id
        description: Primary key for the customer dimension.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name from the source application.
      - name: last_name
        description: Customer's family name from the source application.
      - name: first_order_date
        description: Date of the customer's earliest recorded order; null when the customer has not placed an order.
      - name: most_recent_order_date
        description: Date of the customer's most recent recorded order; null when the customer has not placed an order.
      - name: number_of_orders
        description: Total number of recorded orders for the customer, including every order status.
        data_tests:
          - not_null

  - name: fct_orders
    description: One record per order, providing the order identifier, customer, date, and current status.
    columns:
      - name: order_id
        description: Primary key for the order fact.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Calendar date on which the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current lifecycle status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']

  - name: customer_order_rankings
    description: One record per customer ranked by total recorded orders. Customers with the same order count receive the same dense rank, and customers with no orders are included.
    columns:
      - name: customer_id
        description: Primary key for the ranked customer record and foreign key to the customer dimension.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's given name from the customer dimension.
      - name: last_name
        description: Customer's family name from the customer dimension.
      - name: total_orders
        description: Total number of recorded orders for the customer; zero when the customer has no orders.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank of the customer by total orders in descending order, where 1 represents the highest order count.
        data_tests:
          - not_null
