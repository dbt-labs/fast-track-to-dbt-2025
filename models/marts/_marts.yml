version: 2

models:
  - name: dim_customers
    description: One row per customer, including order dates and the all-time order count across all statuses. Customers without orders are included.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null for customers without orders.
      - name: number_of_orders
        description: All-time number of orders across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, including all source order statuses.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status inherited from the source.
