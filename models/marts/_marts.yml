version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension with one row per customer from stg_customers, including
      customers without orders. Enriches customer names with first and most recent
      order dates and an all-time order count from stg_orders. All order statuses
      are included; no date or status filters are applied.
    columns:
      - name: customer_id
        description: Primary key for dim_customers, inherited from stg_customers; used to join to fct_orders and customer_order_rankings.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as provided by the customers source, without additional transformation.
      - name: last_name
        description: Customer's last name as provided by the customers source, without additional transformation.
      - name: first_order_date
        description: Earliest non-null order_date in stg_orders for this customer across all statuses; null when there is no known order date.
      - name: most_recent_order_date
        description: Latest non-null order_date in stg_orders for this customer across all statuses; null when there is no known order date.
      - name: number_of_orders
        description: All-time count of non-null order IDs in stg_orders for this customer across all statuses; zero for customers without orders.

  - name: fct_orders
    description: >
      Order fact with one row per order from stg_orders. Preserves the order
      identifier, customer identifier, order date, and source status without
      additional filtering or aggregation. Use customer_id to join to
      dim_customers. All source order statuses are retained.
    columns:
      - name: order_id
        description: Primary key for fct_orders, inherited from stg_orders and originally the orders source id.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer associated with the order, originally orders.user_id; joins to dim_customers.customer_id.
      - name: order_date
        description: Date associated with the order in the orders source, passed through stg_orders without additional transformation.
      - name: status
        description: Order status recorded in the orders source, passed through stg_orders without filtering or remapping.
