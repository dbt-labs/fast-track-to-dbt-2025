version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension for customer-level reporting, with one row per customer
      from stg_customers, including customers who have never ordered. Summarizes
      stg_orders across all dates and statuses to provide first and most recent
      order dates and a lifetime order count. Customers without orders have null
      order dates and a zero order count.
    columns:
      - name: customer_id
        description: Customer identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers without orders.
      - name: number_of_orders
        description: Number of orders across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Order fact model for order-volume and status reporting, with one row per
      order from stg_orders. Retains the customer identifier, order date, and
      status without filtering by date or status. The customer identifier links
      orders to dim_customers for customer-level analysis.

    columns:
      - name: order_id
        description: Order identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order, referencing dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current order lifecycle status, validated on the orders source.
