version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders, with order dates and total order count.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of the customer's first order; null for customers with no orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers with no orders.
      - name: number_of_orders
        description: Total number of orders across all statuses; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, retaining all orders and statuses from stg_orders.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order; references dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status, validated against accepted values at the source.

  - name: customer_order_rankings
    description: >
      One row per customer in dim_customers, ranked by the total number of orders
      in fct_orders across all dates and statuses. Includes customers with no orders.
      Outputs customer_id, first_name, last_name, total_orders, and customer_order_rank.
      total_orders is calculated from fct_orders and is the count used for ranking.

    columns:
      - name: customer_id
        description: Customer identifier inherited from dim_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: total_orders
        description: Count of non-null order IDs in fct_orders for the customer; zero when no orders exist.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank by total_orders descending; rank 1 has the most orders, ties share a rank, and ranks have no gaps.
        data_tests:
          - not_null
