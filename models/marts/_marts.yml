version: 2

models:
  - name: dim_customers
    description: >
      One row per customer from stg_customers, with customer names and all-time
      order activity summaries for customer-level analysis. Includes first and
      most recent order dates and an order count across all statuses. Customers
      with no orders are retained with a zero order count and null order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Number of orders associated with the customer; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      One row per order from stg_orders, containing the order identifier,
      customer identifier, order date, and status for order-level analysis.
      Retains all orders supplied by stg_orders without additional filtering
      or aggregation and provides the order counts used by customer_order_rankings.
    columns:
      - name: order_id
        description: Primary key for the orders table 
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key for the customers table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
