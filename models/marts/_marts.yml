version: 2

models:
  - name: dim_customers
    description: >
      One row per customer, including customers without orders, with first and
      most recent order dates and a count of orders across all statuses.
    columns:
      - name: customer_id
        description: Customer identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers without orders.
      - name: number_of_orders
        description: Number of orders across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order across all statuses, linked to its customer.
    columns:
      - name: order_id
        description: Order identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order, referencing dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current order lifecycle status, validated on the orders source.
