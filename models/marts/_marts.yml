version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension with one row per customer from stg_customers, including
      customers with no orders. Combines customer names with first and latest
      order dates and a lifetime order count from stg_orders across all statuses.
      Customers with no orders have a zero count and null order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier from stg_customers; join key to customer-level order activity.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name, passed through unchanged from stg_customers.
      - name: last_name
        description: Customer's last name, passed through unchanged from stg_customers.
      - name: number_of_orders
        description: Count of non-null order IDs in stg_orders for this customer across all statuses, or zero for customers with no orders.
        data_tests:
          - not_null
      - name: first_order_date
        description: Earliest order date in stg_orders for this customer across all statuses; null for customers with no orders.
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"
      - name: most_recent_order_date
        description: Latest order date in stg_orders for this customer across all statuses; null for customers with no orders.
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"

  - name: fct_orders
    description: >
      Order fact model with one row per order from stg_orders. Retains every
      order without filtering by status, with its customer identifier, order
      date, and source status for order-volume and customer-activity analysis.
    columns:
      - name: order_id
        description: Unique order identifier from stg_orders; identifies an individual order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; foreign key to dim_customers.customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed, passed through unchanged from stg_orders.
        data_tests:
          - not_null
      - name: status
        description: Order status passed through unchanged from stg_orders; all source statuses are retained in this model.
        data_tests:
          - not_null


  - name: customer_order_rankings
    description: >
      One row per customer from dim_customers, ranked by lifetime order count
      from fct_orders across all statuses. Customers with no orders are included
      with zero total_orders. Equal totals share a rank, with gaps after ties.
      All existing dim_customers columns are retained; number_of_orders is its
      original staging-derived count, while total_orders is sourced from fct_orders.
    columns:
      - name: customer_id
        description: Unique customer identifier inherited from dim_customers; join key to the customer dimension.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name, inherited unchanged from dim_customers.
      - name: last_name
        description: Customer's last name, inherited unchanged from dim_customers.
      - name: first_order_date
        description: Earliest order date across all statuses, inherited from dim_customers and derived from stg_orders; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses, inherited from dim_customers and derived from stg_orders; null for customers with no orders.
      - name: total_orders
        description: Count of non-null order IDs in fct_orders for this customer across all statuses, or zero for customers with no orders; determines order_rank.
        data_tests:
          - not_null
      - name: order_rank
        description: Rank across all customers by total_orders descending, starting at 1; equal totals share a rank and subsequent ranks have gaps after ties.
        data_tests:
          - not_null
      - name: number_of_orders
        description: Count of non-null order IDs in stg_orders across all statuses, inherited from dim_customers; zero for customers with no orders and separate from the fct_orders-derived total_orders.
        data_tests:
          - not_null
