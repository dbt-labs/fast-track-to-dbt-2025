models:
  - name: dim_customers
    description: One row per customer with order activity summarized across all orders.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Total number of order records associated with the customer.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, including cancelled and deleted orders.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Unique identifier for the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - placed
                  - return_pending
                  - returned
                  - shipped

  - name: customer_order_rankings
    description: >-
      One row per customer ranked by total orders. Includes customers with zero
      orders and counts all records in fct_orders, including cancelled and deleted orders.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: total_orders
        description: Total number of order records associated with the customer.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Dense rank by total orders descending; tied customers share a rank.
        data_tests:
          - not_null
