version: 2

models:
  - name: dim_customers
    description: One row per customer with order summaries, including customers without orders.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Earliest order date across all statuses; null if no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null if no orders.
      - name: number_of_orders
        description: All-time order count across all statuses; zero if no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order across all statuses.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer identifier referencing dim_customers.customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status inherited from the source.
