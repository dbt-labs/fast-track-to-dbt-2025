version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders, with order dates and lifetime order count.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Number of orders for this customer; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, with its customer, order date, and status.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
