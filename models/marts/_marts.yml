models:
  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']

  - name: dim_customers
    description: One record per customer, including customers with no orders.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: number_of_orders
        data_tests:
          - minimum_value:
              arguments:
                minimum_value: 0

  - name: customer_order_rankings
    description: One record per customer with their order-volume rank.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: number_of_orders
        data_tests:
          - minimum_value:
              arguments:
                minimum_value: 0
      - name: customer_order_rank
        data_tests:
          - not_null
          - minimum_value:
              arguments:
                minimum_value: 1
