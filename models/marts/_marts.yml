version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for analyzing purchase history, with one row per customer
      from stg_customers, including customers with no orders. Summarizes stg_orders
      across all order statuses into first and most recent order dates and an
      all-time count of order IDs. Customers with no orders have null order dates
      and an order count of zero.

    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers with no orders.
      - name: number_of_orders
        description: All-time order count across all statuses, or zero if none.
        data_tests:
          - not_null

  - name: fct_orders
    description: >-
      Order-level fact model for analyzing order volume, timing, and status, with
      one row per order from stg_orders. Preserves the order ID, customer ID,
      order date, and status without filtering any order statuses. Use customer_id
      to join to dim_customers for customer attributes.

    columns:
      - name: order_id
        description: Primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key for the customers table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status; accepted values are validated at the source layer.
