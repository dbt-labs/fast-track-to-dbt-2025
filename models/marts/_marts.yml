version: 2

models:
  - name: dim_customers
    description: One row per customer, with first and most recent order dates and lifetime order count across all statuses.
    columns:
      - name: customer_id
        description: Customer identifier; the grain of this model.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
        data_tests:
          - not null
      - name: last_name
        description: Customer last name.
        data_tests:
          - not null
      - name: first_order_date
        description: Earliest order date; null for customers without orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers without orders.
      - name: number_of_orders
        description: Lifetime order count across all statuses, or zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, including its customer, date, and status.
    columns:
      - name: order_id
        description: Primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; links to customer_id in dim_customers.

        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status passed through from the source.
        data_tests:
            - not_null
            # Observed statuses; review new values before extending this list.
            - accepted_values:
                arguments:
                  values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
                config:
                  severity: warn
