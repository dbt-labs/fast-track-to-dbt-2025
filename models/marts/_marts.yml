models:
  - name: dim_customers
    description: Customer dimension for customer-level analysis. One row per customer, retaining customers with no orders and summarizing their order history.
    columns:
      - name: customer_id
        description: Stable identifier for the customer and primary key of this dimension.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's given name from the customer source record.

      - name: last_name
        description: Customer's family name from the customer source record.

      - name: first_order_date
        description: Date of the customer's earliest recorded order; null when the customer has never placed an order.

      - name: most_recent_order_date
        description: Date of the customer's latest recorded order; null when the customer has never placed an order.

      - name: number_of_orders
        description: Count of recorded orders for the customer, with zero assigned to customers with no orders.

  - name: fct_orders
    description: Order fact table for order-level analysis. One row per order from the staged orders source.
    columns:
      - name: order_id
        description: Stable identifier for the order and primary key of this fact table.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Identifier of the customer who placed the order; joins to dim_customers.customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: Calendar date on which the order was recorded.

      - name: status
        description: Current lifecycle status assigned to the order in the source system.

  - name: customer_order_rankings
    description: Customer leaderboard ranked by recorded order volume. One row per customer, including customers with no orders.
    columns:
      - name: customer_id
        description: Identifier of the ranked customer; joins to dim_customers.customer_id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: first_name
        description: Ranked customer's given name, supplied by dim_customers.

      - name: last_name
        description: Ranked customer's family name, supplied by dim_customers.

      - name: total_orders
        description: Count of recorded orders for the customer, with zero assigned when no orders exist.
        data_tests:
          - not_null

      - name: customer_order_rank
        description: Dense descending rank of customers by total_orders; customers with the same count share a rank.
        data_tests:
          - not_null
