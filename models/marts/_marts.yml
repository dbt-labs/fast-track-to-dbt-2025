models:
  - name: dim_customers
    description: One row per customer with order activity aggregates.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name.
        data_tests:
          - not_null
      - name: last_name
        description: Customer's family name.
        data_tests:
          - not_null
      - name: first_order_date
        description: Date of the customer's earliest recorded order; null when the customer has no orders.
      - name: most_recent_order_date
        description: Date of the customer's latest recorded order; null when the customer has no orders.
      - name: number_of_orders
        description: Lifetime count of recorded orders for the customer, including zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Unique identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current lifecycle status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: customer_order_rankings
    description: One row per customer with lifetime order count and order-volume rank.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer's given name.
      - name: last_name
        description: Customer's family name.
      - name: total_orders
        description: Lifetime count of recorded orders for the customer, including zero for customers with no orders.
        data_tests:
          - not_null
      - name: customer_order_rank
        description: Rank of the customer by lifetime order count, with tied counts sharing the same rank.
        data_tests:
          - not_null
