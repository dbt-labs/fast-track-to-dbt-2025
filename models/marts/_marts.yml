version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension with one row per customer from stg_customers, combining
      customer names with first and most recent order dates and a lifetime order
      count from stg_orders. Supports customer-level order activity analysis
      across all order dates and statuses. Includes customers with no orders,
      whose order count is zero and whose order dates are null.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Number of orders for this customer; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Order fact model with one row per order from stg_orders, containing the
      order identifier, customer identifier, order date, and status. Provides
      order-level detail for order volume analysis and customer order summaries.
      Includes all order dates and statuses without additional filtering.
    columns:
      - name: order_id
        description: Primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key for the customers table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
