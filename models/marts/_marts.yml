version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers with no orders, with all-time order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null for customers with no orders.
      - name: number_of_orders
        description: All-time order count across all statuses; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order, retaining all order statuses from stg_orders.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Order status as recorded in the source application.
        data_tests:
          - not_null
