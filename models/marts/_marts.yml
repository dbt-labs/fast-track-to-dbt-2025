version: 2

models:
  - name: dim_customers
    description: One row per customer, including customers without orders, with lifetime order counts and first/latest order dates.
    data_tests:
      - expression_is_true:
          name: dim_customers_nonnegative_order_count
          arguments:
            expression: "number_of_orders >= 0"
      - expression_is_true:
          name: dim_customers_consistent_order_dates
          arguments:
            expression: >-
              (number_of_orders = 0
                and first_order_date is null
                and most_recent_order_date is null)
              or
              (number_of_orders > 0
                and first_order_date is not null
                and most_recent_order_date is not null
                and first_order_date <= most_recent_order_date)
    columns:
      - name: customer_id
        description: Unique customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: First order date; null for customers without orders.
      - name: most_recent_order_date
        description: Most recent order date; null for customers without orders.
      - name: number_of_orders
        description: Lifetime order count across all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order from stg_orders, across all order statuses.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status as received from the source.
