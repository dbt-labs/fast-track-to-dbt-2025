version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for customer-level reporting and order-history analysis.
      One row per customer from stg_customers, including customers with no orders.
      First and most recent order dates and order counts are calculated from
      stg_orders across all order statuses, with no date filter. Customers with
      no orders have null order dates and an order count of zero.
    columns:
      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: first_order_date
        description: Earliest order date; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date; null for customers with no orders.
      - name: number_of_orders
        description: Count of orders across all statuses, or zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >-
      Order fact table for order-volume reporting and customer order analysis.
      One row per order from stg_orders, retaining the order identifier,
      customer identifier, order date, and status without additional filtering
      or aggregation. Includes all order statuses; reports requiring a specific
      status or date range must apply those filters explicitly.
    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status from stg_orders.
