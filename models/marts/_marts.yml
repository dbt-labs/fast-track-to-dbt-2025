version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for analyzing order activity, with one row per customer
      in stg_customers. Includes customer names, first and most recent order
      dates, and a count of orders across all statuses from stg_orders.
      Customers without orders are retained with null order dates and an order
      count of zero.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of the customer's first order; null for customers without orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers without orders.
      - name: number_of_orders
        description: Number of orders for the customer, including all statuses; zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >-
      Order fact model for analyzing order volume, timing, and status, with one
      row per order from stg_orders. Includes the customer identifier for joining
      to dim_customers. All order statuses are retained; returned and
      return-pending orders are included in order counts.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                # Keep aligned with the valid statuses in the source definition.
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
