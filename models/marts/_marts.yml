version: 2

models:
  - name: dim_customers
    description: One row per customer with lifetime order counts and first and most recent order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of the customer's first order; null for customers with no orders.
      - name: most_recent_order_date
        description: Date of the customer's most recent order; null for customers with no orders.
      - name: number_of_orders
        description: Lifetime order count across all statuses; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order across all order statuses.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current order status.
