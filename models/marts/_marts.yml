models:
  - name: fct_orders
    description: One record per order.
    columns:
      - name: order_id
        description: primary key for the orders tabel.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: foreign key for the customers tabel.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'completed','placed', 'return_pending', 'returned', 'shipped']

  - name: dim_customers
    description: One record per customer with order activity aggregated at the customer grain.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: number_of_orders
        data_tests:
          - not_null

  - name: customer_order_rankings
    description: One record per customer with a dense rank based on order count.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: number_of_orders
        data_tests:
          - not_null
      - name: customer_order_rank
        data_tests:
          - not_null
