models:
  - name: dim_customers
    description: One row per customer, enriched with first and most recent order dates and a lifetime order count. Customers without orders are retained with a zero order count and null order dates.
    columns:
      - name: customer_id
        description: Primary key for the customer, sourced from the application customer record.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name as recorded in the application.

      - name: last_name
        description: Customer's last name as recorded in the application.

      - name: first_order_date
        description: Earliest order date for the customer; null when the customer has not placed an order.

      - name: most_recent_order_date
        description: Latest order date for the customer; null when the customer has not placed an order.

      - name: number_of_orders
        description: Lifetime count of orders associated with the customer, set to zero for customers without orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order from the application, exposing the ordering customer, order date, and current lifecycle status for order analysis.
    columns:
      - name: order_id
        description: Primary key for the order, sourced from the application order record.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer who placed the order; joins to dim_customers on customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: Date the order was placed in the application.

      - name: status
        description: Current lifecycle status of the order, such as placed, shipped, completed, returned, or pending return.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - placed
                  - return_pending
                  - returned
                  - shipped

  - name: customer_order_rankings
    description: One row per customer with a lifetime order count and dense ranking from highest to lowest order volume. Customers with equal counts share a rank, and customers without orders are included with zero orders.
    columns:
      - name: customer_id
        description: Primary key for the ranked customer; joins to dim_customers on customer_id.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name as exposed by dim_customers.

      - name: last_name
        description: Customer's last name as exposed by dim_customers.

      - name: total_orders
        description: Lifetime count of orders associated with the customer, set to zero for customers without orders.
        data_tests:
          - not_null

      - name: customer_rank
        description: Dense rank of the customer by total_orders in descending order; tied order counts receive the same rank.
        data_tests:
          - not_null
