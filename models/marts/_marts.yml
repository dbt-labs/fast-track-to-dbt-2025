version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension for analyzing all-time ordering activity, with one row
      per customer from stg_customers. Includes customer names, order counts,
      and first and most recent order dates across all order statuses in
      stg_orders. Customers with no orders are retained with a zero order count
      and null order dates.
    columns:
      - name: customer_id
        description: Unique customer identifier from stg_customers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Earliest order date across all statuses; null for customers with no orders.
      - name: most_recent_order_date
        description: Latest order date across all statuses; null for customers with no orders.
      - name: number_of_orders
        description: All-time order count across all statuses; zero for customers with no orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >-
      Order-level fact model for analyzing order volume, timing, and status and
      linking orders to dim_customers through customer_id. Contains one row per
      order from stg_orders, retaining all order statuses without filtering or
      aggregation.
    columns:
      - name: order_id
        description: Unique order identifier from stg_orders; the primary key of this model.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order; joins to customer_id in dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Order status as recorded in the source application.
        data_tests:
          - not_null
