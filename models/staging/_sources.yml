sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: Primary key for the customers table.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the app database.
          - name: last_name
            description: Customer's last name as recorded in the app database.
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for the orders table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer associated with the order; references customers.id and becomes customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date of the order as recorded in the app database.
            data_tests:
              - not_null
          - name: status
            description: Order status from the app database; expected values are completed, placed, return_pending, returned, and shipped.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
          - name: _etl_loaded_at
            description: ETL load timestamp supplied by the source ingestion process.
