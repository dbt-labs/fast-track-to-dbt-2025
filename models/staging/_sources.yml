sources:
  - name: jaffle_shop
    description: >
      Replica of the application's Postgres database, stored in Snowflake at
      raw.jaffle_shop. Provides the customer and order records used by the
      staging models and downstream customer and order reporting marts.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >
          Customer records at one row per customer, keyed by id. Supplies
          customer identifiers and names to stg_customers, which feeds the
          customer dimension and customer order rankings. Customers are not
          required to have orders to appear in customer reporting.
        columns:
          - name: id
            description: Unique customer identifier, renamed to customer_id in stg_customers and referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
              
      - name: orders
        description: >
          Order records at one row per order, keyed by id and linked to
          customers through user_id. Feeds stg_orders without status filtering
          for order-level reporting, lifetime customer order counts, and first
          and most recent order dates. Downstream counts include all source
          statuses rather than only completed orders.
        columns:
          - name: id
            description: Unique order identifier, renamed to order_id in stg_orders and counted in customer order summaries.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed; used to calculate each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >
              Source order status, passed through unchanged to stg_orders and
              fct_orders. The accepted-values test permits placed, shipped,
              completed, return_pending, and returned.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
