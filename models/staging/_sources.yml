sources:
  - name: jaffle_shop
    description: >
      Replica of the application's Postgres database in raw.jaffle_shop.
      Provides customer records and order history for the customer and order
      staging models and downstream marts.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >
          Application customer records, with one row per customer identified by
          id. Supplies customer identifiers and names to stg_customers and joins
          to orders through orders.user_id.
        columns:
          - name: id
            description: Customer identifier and primary key; renamed to customer_id in stg_customers and referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the application; passed through unchanged by stg_customers.
          - name: last_name
            description: Customer's last name as recorded in the application; passed through unchanged by stg_customers.
      - name: orders
        description: >
          Application order history, with one row per order identified by id.
          Includes cancelled and deleted orders. Supplies order identifiers,
          customer references, dates, and statuses to stg_orders, which applies
          no status filtering.
        columns:
          - name: id
            description: Order identifier and primary key; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Order date recorded in the application; used downstream to determine each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: Order status recorded in the application; passed through unchanged by stg_orders, with all statuses retained in downstream order counts.
