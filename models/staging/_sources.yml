sources:
  - name: jaffle_shop
    description: >
      Replica of the application's Postgres database in the raw.jaffle_shop
      schema. Contains the customer and order records used for customer
      profiles, order activity summaries, and customer order rankings.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >
          One record per application customer, identified by id, with first
          and last names. Supplies the customer records selected by
          stg_customers and used in the customer dimension, including
          customers who have not placed an order.
        columns:
          - name: id
            description: Primary key for the customers source table; corresponds to user_id in the orders source table.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: >
          One record per application order, identified by id, with the
          customer identifier, order date, and status. Includes cancelled
          and deleted orders. Feeds stg_orders and the order fact model
          and supplies the order activity summarized in dim_customers.

        columns:
          - name: id
            description: Primary key for the orders source table; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer associated with the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed; used to derive each customer's first and most recent order dates.
            data_tests:
              - not_null
