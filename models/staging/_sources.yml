sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: (PK) Unique identifier for a customer.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: (PK) Unique identifier for a order.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Foreign key to the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the customer placed the order.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order, including returns.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
