sources:
  - name: jaffle_shop
    description: Raw application data replicated from the Jaffle Shop operational database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One row per customer account in the application.
        columns:
          - name: id
            description: Primary key for the customer account.
            data_tests:
              - unique
              - not_null

          - name: first_name
            description: Customer's given name.

          - name: last_name
            description: Customer's family name.

      - name: orders
        description: One row per order recorded by the application, including orders in returned and return-pending states.
        columns:
          - name: id
            description: Primary key for the order.
            data_tests:
              - unique
              - not_null

          - name: user_id
            description: Identifier of the customer who placed the order; joins to customers.id.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id

          - name: order_date
            description: Date on which the order was placed.
            data_tests:
              - not_null

          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null

          - name: _etl_loaded_at
            description: Timestamp when the replication process loaded the source record into the warehouse.
