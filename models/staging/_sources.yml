sources:
  - name: jaffle_shop
    description: Replica of the application's Postgres database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One row per customer.
        columns:
          - name: id
            description: Unique customer identifier.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name.
          - name: last_name
            description: Customer's last name.
      - name: orders
        description: One row per order, including cancelled and deleted orders.
        columns:
          - name: id
            description: Unique order identifier.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Customer identifier referencing customers.id.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Order status in the source application.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
          - name: _etl_loaded_at
            description: Timestamp when the order record was loaded.
