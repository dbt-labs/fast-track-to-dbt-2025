sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: Application-assigned customer identifier that defines the table grain and joins to orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name as recorded in the application database.
          - name: last_name
            description: Customer last name as recorded in the application database.

      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Application-assigned order identifier that defines the table grain.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Customer associated with the order; references customers.id.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date recorded for the order in the application database.
            data_tests:
              - not_null
          - name: status
            description: Current order lifecycle status supplied by the application database.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - completed
                      - placed
                      - return_pending
                      - returned
                      - shipped
          - name: _etl_loaded_at
            description: Timestamp when the source replication process loaded the order record into the warehouse.

