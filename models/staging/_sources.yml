version: 2

sources:
  - name: jaffle_shop
    description: >
      Replica of the Postgres database used by the application. Provides raw
      customer and order records for the staging models.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer registered in the application, including customers with no orders.
        columns:
          - name: id
            description: Unique customer identifier in the application; renamed to customer_id in stg_customers.
            data_tests:
              - not_null
              - unique
          - name: first_name
            description: Customer's first name as recorded in the application.
          - name: last_name
            description: Customer's last name as recorded in the application.

      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Unique order identifier in the application; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed, as recorded in the application.
            data_tests:
              - not_null
          - name: status
            description: >
              Current application status of the order. Observed values are placed,
              shipped, completed, return_pending, and returned.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
