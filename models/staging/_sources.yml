sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, stored in Snowflake under
      raw.jaffle_shop. Provides the raw customer and order records used by the
      staging models and downstream customer and order marts.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          One record per customer in the application database replica. Supplies
          customer identifiers and names to stg_customers for customer-level
          reporting and joins to orders through customers.id = orders.user_id.
        columns:
          - name: id
            description: Unique customer identifier; primary key of this source table and renamed to customer_id in stg_customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as supplied by the application database replica; passed through unchanged in stg_customers.
          - name: last_name
            description: Customer's last name as supplied by the application database replica; passed through unchanged in stg_customers.
      - name: orders
        description: >-
          One record per order in the application database replica. Supplies
          order identifiers, customer references, dates, and statuses to
          stg_orders without filtering. Used downstream for order-volume
          reporting, customer order histories, and customer rankings.
        columns:
          - name: id
            description: Unique order identifier; primary key of this source table and renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer associated with the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date of the order as supplied by the application database replica; used downstream to calculate first and most recent customer order dates.
            data_tests:
              - not_null
          - name: status
            description: "Order status as supplied by the application database replica. Accepted values are placed, shipped, completed, return_pending, and returned. Passed through unchanged in stg_orders."
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
