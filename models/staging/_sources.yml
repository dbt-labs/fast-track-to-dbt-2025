sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, containing customer
      records and order activity. Supplies the staging models used to build
      customer order histories and order-volume rankings.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          Customer records from the application, with one row per customer ID.
          Provides customer identifiers and names to stg_customers; customers
          are not required to have placed an order to appear in this table.
        columns:
          - name: id
            description: Primary key for the customer record, renamed to customer_id in stg_customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded by the application.
          - name: last_name
            description: Customer's last name as recorded by the application.

      - name: orders
        description: >-
          Order records from the application, with one row per order ID.
          Provides the customer reference, order date, and status to stg_orders.
          The staging model retains all rows without filtering by status.
        columns:
          - name: id
            description: Primary key for the order record, renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Customer associated with the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date of the order as recorded by the application, passed through unchanged to stg_orders.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order status recorded by the application. Expected values,
              enforced by the accepted-values test, are placed, shipped,
              completed, return_pending, and returned.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
