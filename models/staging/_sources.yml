sources:
  - name: jaffle_shop
    description: Raw application data for customer and order records.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: Unique identifier for the customer in the source application.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the source application.
          - name: last_name
            description: Customer's last name as recorded in the source application.
      - name: orders
        description: One record per order, including cancelled and deleted orders.
        columns:
          - name: id
            description: Unique identifier for the order in the source application.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
          - name: status
            description: Lifecycle status recorded for the order.