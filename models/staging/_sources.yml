sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, stored in the raw
      database and jaffle_shop schema in Snowflake. Contains customer and
      order records used by stg_customers and stg_orders. These source
      definitions describe the raw application data before dbt transformations.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          Customer records at one row per customer, containing the customer
          identifier and names. Supplies stg_customers, where id is renamed
          to customer_id. Orders link to customers through orders.user_id
          matching customers.id; customers do not need an order to appear
          in this table.
        columns:
          - name: id
            description: Unique, non-null customer identifier and primary key of this source table. Referenced by orders.user_id and renamed to customer_id in stg_customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name as recorded in the application; passed through unchanged by stg_customers.
          - name: last_name
            description: Customer last name as recorded in the application; passed through unchanged by stg_customers.

      - name: orders
        description: >-
          Order records at one row per order, including cancelled and deleted
          orders as documented for this source. Contains the order identifier,
          customer identifier, order date, and status. Supplies stg_orders,
          which renames id to order_id and user_id to customer_id without
          filtering rows or statuses. Order counts derived from these records
          therefore include all available statuses, not only completed orders.
        columns:
          - name: id
            description: Unique, non-null order identifier and primary key of this source table; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order. References customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed, as recorded in the application. Passed through unchanged by stg_orders and used to calculate each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order status recorded in the source and passed through unchanged
              by stg_orders. The current accepted-values test allows placed,
              shipped, completed, return_pending, and returned. Downstream order
              counts include all of these statuses unless explicitly filtered.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
