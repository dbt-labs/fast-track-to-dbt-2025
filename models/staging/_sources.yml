sources:
  - name: jaffle_shop
    description: Replica of the application Postgres database used as the raw input for the jaffle_shop analytics project.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw application customer records, with one row per customer.
        columns:
          - name: id
            description: Unique identifier assigned to the customer in the application database.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's given name as captured by the application.
            data_tests:
              - not_null
          - name: last_name
            description: Customer's family name as captured by the application.
            data_tests:
              - not_null
      - name: orders
        description: Raw application order records, with one row per order; includes orders in all lifecycle states.
        columns:
          - name: id
            description: Unique identifier assigned to the order in the application database.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references `jaffle_shop.customers.id`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date on which the order was placed in the application.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order in the application.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
          - name: _etl_loaded_at
            description: Timestamp when the record was loaded into the raw warehouse replica.
            data_tests:
              - not_null
