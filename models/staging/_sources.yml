sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: Primary key for the customers source table.
            data_tests:
              - unique
              - not_null
                            
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for the orders source table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references id in the customers source table and becomes customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed; passed through unchanged to stg_orders.
            data_tests:
              - not_null
          - name: status
            description: Order status recorded by the application; passed through unchanged to stg_orders.
            data_tests:
              - not_null
              # Observed statuses; review new values before extending this list.
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
                  config:
                    severity: warn
