sources:
  - name: jaffle_shop
    description: Replica of the application Postgres database that provides raw customer and order records for this project.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw application customer records. Each row represents one customer.
        columns:
          - name: id
            description: Unique identifier for the customer in the application database.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's given name as captured by the application.
          - name: last_name
            description: Customer's family name as captured by the application.
      - name: orders
        description: Raw application order records. Each row represents one order, including orders that were returned or are pending return.
        columns:
          - name: id
            description: Unique identifier for the order in the application database.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier for the customer who placed the order; joins to the raw `customers` source.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
          - name: status
            description: Current lifecycle status of the order in the application.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']