sources:
  - name: jaffle_shop
    description: Replica of the application database containing customer and order records.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One row per customer account in the application.
        columns:
          - name: id
            description: Unique identifier for the customer in the application database.
            data_tests:
              - unique
              - not_null

      - name: orders
        description: One row per order, including orders that were cancelled, returned, or are still in progress.
        columns:
          - name: id
            description: Unique identifier for the order in the application database.
            data_tests:
              - unique
              - not_null

          - name: user_id
            description: Identifier of the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id

          - name: order_date
            description: Date on which the order was placed.
            data_tests:
              - not_null

          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
