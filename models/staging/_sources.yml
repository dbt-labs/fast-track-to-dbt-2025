version: 2

sources:
  - name: jaffle_shop
    description: Replica of the application Postgres database, ingested into the raw Snowflake database for analytics transformations.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One row per customer registered in the application.
        columns:
          - name: id
            description: Application-assigned identifier for the customer; renamed to `customer_id` in `stg_customers`.
          - name: first_name
            description: Customer's given name as captured during registration.
          - name: last_name
            description: Customer's family name as captured during registration.
      - name: orders
        description: One row per order recorded by the application, including orders that were later cancelled or deleted.
        columns:
          - name: id
            description: Application-assigned identifier for the order; renamed to `order_id` in `stg_orders`.
          - name: user_id
            description: Identifier of the customer who placed the order; renamed to `customer_id` in `stg_orders`.
          - name: order_date
            description: Date on which the order was recorded by the application.
          - name: status
            description: Current lifecycle status of the order, including fulfilment and return states.
