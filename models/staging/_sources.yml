sources:
  - name: jaffle_shop
    description: Raw application data from the Jaffle Shop operational database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer account in the source application.
        columns:
          - name: id
            description: Primary key for the customer record.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's given name as recorded in the source application.
          - name: last_name
            description: Customer's family name as recorded in the source application.
      - name: orders
        description: One record per order in the source application, including orders in every lifecycle status.
        columns:
          - name: id
            description: Primary key for the order record.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Foreign key to the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Calendar date on which the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
