sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: Primary key for customers source table. Unique customer identifier in the application; renamed to customer_id in stg_customers and referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name as recorded in the application, passed through unchanged by stg_customers.
          - name: last_name
            description: Customer last name as recorded in the application, passed through unchanged by stg_customers.
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for orders source table. Unique order identifier in the application; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order, referencing customers.id; renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date of the order as recorded in the application; used for first and most recent order dates in dim_customers.
            data_tests:
              - not_null
          - name: status
            description: Order status as recorded in the application; expected values are placed, shipped, completed, return_pending, and returned.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
