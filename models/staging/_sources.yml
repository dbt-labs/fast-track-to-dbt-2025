sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database containing customer and
      order records. Supplies the staging models used for customer reporting,
      order-history analysis, and customer order rankings.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          One record per customer, containing the customer identifier and name.
          Used by stg_customers as the customer population for downstream
          reporting, including customers with no orders.
        columns:
          - name: id
            description: Unique customer identifier, renamed to customer_id in stg_customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name, passed through unchanged by stg_customers.
          - name: last_name
            description: Customer's last name, passed through unchanged by stg_customers.
      - name: orders
        description: >-
          One record per order. Includes cancelled and deleted orders.
          Used by stg_orders without filtering to supply order dates, statuses,
          and customer associations for downstream order counts and reporting.
        columns:
          - name: id
            description: Unique order identifier, renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: >-
              Identifier of the customer who placed the order. References
              customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed, used downstream to calculate first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order lifecycle status, passed through unchanged by stg_orders.
              Expected values are completed, placed, return_pending, returned,
              and shipped, as enforced by the accepted_values test.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
