sources:
  - name: jaffle_shop
    description: Replica of the Postgres application database that provides the raw customer and order records for this project.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer account records. One row per customer.
        columns:
          - name: id
            description: Unique identifier for the customer in the application database.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's given name as recorded in the application.
          - name: last_name
            description: Customer's family name as recorded in the application.
      - name: orders
        description: Raw order records from the application. One row per order, including orders in every lifecycle status.
        columns:
          - name: id
            description: Unique identifier for the order in the application database.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references `jaffle_shop.customers.id`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed in the application.
          - name: status
            description: Current lifecycle status of the order in the application.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
