sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, stored in raw.jaffle_shop.
      Provides customer records and order history for the staging models and
      downstream customer and order marts.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          Application customer records with one row per customer, keyed by id.
          Supplies customer identifiers and names to stg_customers; downstream
          customer models retain customers even when they have no orders.
        columns:
          - name: id
            description: >-
              Unique customer identifier and primary key of the source table.
              Referenced by orders.user_id and renamed to customer_id in
              stg_customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name as recorded by the application; passed through unchanged by stg_customers.
          - name: last_name
            description: Customer last name as recorded by the application; passed through unchanged by stg_customers.
      - name: orders
        description: >-
          Application order history with one row per order, keyed by id.
          Includes cancelled and deleted orders. Supplies the customer, order
          date, and lifecycle status to stg_orders without status filtering,
          supporting order-volume analysis across all statuses downstream.
        columns:
          - name: id
            description: Unique order identifier and primary key of the source table; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: >-
              Identifier of the customer who placed the order. References id
              in the customers source table and is renamed to customer_id in
              stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: >-
              Date the order was placed. Passed through unchanged by stg_orders
              and used to calculate customers' first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order lifecycle status recorded by the application. Expected
              values are placed, shipped, completed, return_pending, and
              returned. The accepted-values test warns on unexpected statuses;
              stg_orders passes all statuses through unchanged.
            data_tests:
              - not_null
              # Observed statuses; review new lifecycle values before extending.
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
                  config:
                    severity: warn
