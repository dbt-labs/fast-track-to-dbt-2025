sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: first_name
            data_tests:
              - not_null
          - name: last_name
            data_tests:
              - not_null
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            data_tests:
              - not_null
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']


models:
  - name: stg_customers
    description: One row per customer, with source identifiers standardized for downstream use.
    columns:
      - name: customer_id
        description: Primary key for the customer, renamed from the source `id` column.
      - name: first_name
        description: Customer's first name from the source system.
      - name: last_name
        description: Customer's last name from the source system.

  - name: stg_orders
    description: One row per order, with source identifiers standardized for downstream use.
    columns:
      - name: order_id
        description: Primary key for the order, renamed from the source `id` column.
      - name: customer_id
        description: Identifier of the customer who placed the order, renamed from the source `user_id` column.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current lifecycle status of the order.
