sources:
  - name: jaffle_shop
    description: Replica of the application's Postgres database containing customer and order records.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer, identified by id.
        columns:
          - name: id
            description: Primary key for the customers source table; referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for the orders source table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed; used to calculate each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: "Order lifecycle status. Expected values are placed, shipped, completed, return_pending, and returned."
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
