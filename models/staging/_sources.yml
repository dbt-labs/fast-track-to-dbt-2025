sources:
  - name: jaffle_shop
    description: >
      Replica of the application's Postgres database, stored in raw.jaffle_shop.
      Provides customer records and order activity for the staging models that
      feed customer reporting, order reporting, and customer order rankings.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >
          Application customer records, with one row per customer identified by
          id. Supplies customer identifiers and first and last names to
          stg_customers, forming the customer population used by dim_customers
          and customer_order_rankings. The staging model applies no order-based
          filter, allowing customers without orders to remain in reporting.
        columns:
          - name: id
            description: Customer identifier and primary key.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: >
          Application order records, with one row per order identified by id.
          Records the customer in user_id, the order date, and the current
          lifecycle status. Supplies stg_orders without date or status filters
          for downstream order reporting and lifetime customer order counts.
          Status values are validated against placed, shipped, completed,
          return_pending, and returned.
        columns:
          - name: id
            description: Order identifier and primary key.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current order lifecycle status.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
