sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: Primary key for the customers table.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the app; passed through by stg_customers.
          - name: last_name
            description: Customer's last name as recorded in the app; passed through by stg_customers.
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for the orders table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date of the order; used to calculate each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: Order lifecycle status. Accepted values are placed, shipped, completed, return_pending, and returned.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
