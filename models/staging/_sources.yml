sources:
  - name: jaffle_shop
    description: Raw application database replica containing customer accounts and order lifecycle records used by the staging layer.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer account in the application database.
        columns:
          - name: id
            description: Unique identifier for the customer account; renamed to `customer_id` in `stg_customers`.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: One record per order submitted in the application database, including orders in cancelled, returned, and pending-return states.
        columns:
          - name: id
            description: Unique identifier for the order; renamed to `order_id` in `stg_orders`.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer account that submitted the order; renamed to `customer_id` in `stg_orders`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Calendar date on which the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status reported for the order.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
