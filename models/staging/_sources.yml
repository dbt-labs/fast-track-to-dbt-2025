sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, stored in raw.jaffle_shop.
      Contains the customer and order records used by the staging models and
      downstream customer and order marts.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          One record per customer in the application. Provides customer identifiers
          and names to stg_customers for customer-level reporting.
        columns:
          - name: id
            description: Unique customer identifier; primary key of this source table and renamed to customer_id in stg_customers.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the application; passed through to stg_customers.
          - name: last_name
            description: Customer's last name as recorded in the application; passed through to stg_customers.

      - name: orders
        description: >-
          One record per order in the application, including cancelled and deleted
          orders as documented by the source. Provides order identifiers, customer
          links, dates, and statuses to stg_orders.
        columns:
          - name: id
            description: Unique order identifier; primary key of this source table and renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed; passed through to stg_orders and used for customers' first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order status recorded by the application. Expected values are placed,
              shipped, completed, return_pending, and returned, as enforced by the
              accepted_values test. Passed through to stg_orders without filtering.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
