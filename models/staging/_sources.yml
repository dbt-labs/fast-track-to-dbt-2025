sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, stored in raw.jaffle_shop.
      Provides customer and order records for the staging models that feed
      customer activity reporting and order-volume rankings.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          Raw application customer records, with one row per customer. Supplies
          customer identifiers and names to stg_customers and the customer
          dimension, which retains customers even when they have no orders.
        columns:
          - name: id
            description: Unique customer identifier, renamed to customer_id in stg_customers and referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the application, passed through by stg_customers.
          - name: last_name
            description: Customer's last name as recorded in the application, passed through by stg_customers.

      - name: orders
        description: >-
          Raw application order records, with one row per order. Includes
          cancelled and deleted orders. Supplies stg_orders with the customer,
          order date, and status used for downstream order counts and rankings;
          the staging model applies no status filter.
        columns:
          - name: id
            description: Unique order identifier, renamed to order_id in stg_orders and counted in downstream customer order totals.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed, used downstream to determine each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order status recorded by the application. Expected values are
              placed, shipped, completed, return_pending, and returned. Passed
              through by stg_orders without filtering, so all statuses contribute
              to downstream order counts.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    # Observed source values; extend when new valid statuses are introduced.
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
