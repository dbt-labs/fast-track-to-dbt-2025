sources:
  - name: jaffle_shop
    description: Replica of the application Postgres database containing raw customer and order records loaded into the warehouse.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw application customer records, with one row per customer.
        columns:
          - name: id
            description: Unique identifier for the customer in the source application.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's given name as captured by the application.
          - name: last_name
            description: Customer's family name as captured by the application.

      - name: orders
        description: Raw application order records, with one row per order. Includes orders across all lifecycle statuses, including returns.
        columns:
          - name: id
            description: Unique identifier for the order in the source application.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer that placed the order; joins to the customers source table.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was recorded in the source application.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle or fulfillment status assigned to the order by the source application.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
