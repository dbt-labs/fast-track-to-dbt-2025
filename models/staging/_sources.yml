sources:
  - name: jaffle_shop
    description: >
      Replica of the application's Postgres database, stored in the raw database's
      jaffle_shop schema. Provides customer records and order history for the
      staging models and downstream customer and order marts.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >
          Application customer records, with one row per customer identified by
          id. Supplies customer identifiers and names to stg_customers and the
          downstream customer dimension; customers do not need an order to be
          included in that dimension.
        columns:
          - name: id
            description: Unique customer identifier and primary key; renamed to customer_id in stg_customers and referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the application; passed through unchanged by stg_customers.
          - name: last_name
            description: Customer's last name as recorded in the application; passed through unchanged by stg_customers.
      - name: orders
        description: >
          Application order history, with one row per order identified by id.
          Links each order to a customer through user_id and supplies the order
          date and status to stg_orders. Staging and the order mart retain all
          source rows without filtering dates or statuses, so customer order
          counts include returned orders.
        columns:
          - name: id
            description: Unique order identifier and primary key; renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed; used downstream to determine each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >
              Order status recorded in the application. Accepted values are
              placed, shipped, completed, return_pending, and returned.
              Passed through unchanged by stg_orders and retained in fct_orders.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
