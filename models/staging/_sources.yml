sources:
  - name: jaffle_shop
    description: Replica of the application's Postgres database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer account in the application.
        columns:
          - name: id
            description: Primary key for the customer.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name.
          - name: last_name
            description: Customer's last name.
      - name: orders
        description: One record per order, including orders in every lifecycle status.
        columns:
          - name: id
            description: Primary key for the order.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier for the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
