sources:
  - name: jaffle_shop
    description: Replica of the application database containing raw customer and order records.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer records at one row per customer.
        columns:
          - name: id
            description: Unique identifier for the customer.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: Raw order records at one row per order, including orders that were cancelled or deleted.
        columns:
          - name: id
            description: Unique identifier for the order.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer associated with the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
