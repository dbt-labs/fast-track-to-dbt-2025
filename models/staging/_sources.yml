sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        columns:
          - name: id
            description: primary key for customers source table
            data_tests:
              - unique
              - not_null

      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: primary key for orders source table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current order status, including cancelled and deleted orders.
            data_tests:
              - not_null
