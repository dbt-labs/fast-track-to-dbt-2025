sources:
  - name: jaffle_shop
    description: Replica of the application database containing raw customer and order records.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer records from the application database; one record per customer.
        columns:
          - name: id
            description: Primary key for the customer in the application database.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's given name.
            data_tests:
              - not_null
          - name: last_name
            description: Customer's family name.
            data_tests:
              - not_null

      - name: orders
        description: Raw order records from the application database; one record per order, including returned orders.
        columns:
          - name: id
            description: Unique identifier for the order in the application database.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order; renamed to customer_id in staging.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
                  config:
                    severity: warn
          - name: order_date
            description: Calendar date on which the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
