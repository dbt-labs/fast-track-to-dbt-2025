sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer, keyed by id.
        columns:
          - name: id
            description: Primary key for customers. Must be unique and not null; referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name. Null values are permitted; no completeness requirement is currently enforced.
          - name: last_name
            description: Customer last name. Null values are permitted; no completeness requirement is currently enforced.
      - name: orders
        description: One record per order, keyed by id. Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for orders. Must be unique and not null.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Required customer foreign key referencing customers.id. Must not be null and must match an existing customer.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was placed. Required; must not be null.
            data_tests:
              - not_null
          - name: status
            description: Required order status. Must not be null and must be one of completed, placed, return_pending, returned, or shipped.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
