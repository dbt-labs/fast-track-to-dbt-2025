sources:
  - name: jaffle_shop
    description: Raw operational data from the Jaffle Shop application database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer in the application.
        columns:
          - name: id
            description: Unique identifier for the customer in the application.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name.
            data_tests:
              - not_null
          - name: last_name
            description: Customer's last name.
            data_tests:
              - not_null

      - name: orders
        description: One record per order in the application, including cancelled and deleted orders.
        columns:
          - name: id
            description: Unique identifier for the order in the application.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Calendar date when the order was placed.
            data_tests:
              - not_null
          - name: status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
          - name: _etl_loaded_at
            description: Timestamp when the record was loaded into the raw warehouse schema.
            data_tests:
              - not_null
