sources:
  - name: jaffle_shop
    description: Replica of the application database containing the raw customer and order records used by this project.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One row per customer account in the application database, including customers who have never placed an order.
        columns:
          - name: id
            description: Stable identifier for the customer account; used as the parent key for order records.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Given name recorded on the customer account.
            data_tests:
              - not_null
          - name: last_name
            description: Family name recorded on the customer account.
            data_tests:
              - not_null

      - name: orders
        description: One row per order recorded in the application database, including orders at every lifecycle status.
        columns:
          - name: id
            description: Stable identifier for the order; the primary key of the raw orders table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer account associated with the order; joins to `customers.id`.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date the order was recorded in the application database.
            data_tests:
              - not_null
          - name: status
            description: Lifecycle status recorded for the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
