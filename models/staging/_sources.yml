sources:
  - name: jaffle_shop
    description: >
      Replica of the application's Postgres database, stored in the raw
      database under the jaffle_shop schema. Provides customer and order
      records for the staging models that feed customer and order analytics.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >
          One record per application customer, identified by id, with first
          and last names. Feeds stg_customers and the customer dimension,
          providing customer details independently of order activity.
        columns:
          - name: id
            description: Primary key for customers source table.
            data_tests:
              - unique
              - not_null
      - name: orders
        description: >
          One record per application order, identified by id, with the
          customer's user_id, order date, and status. Feeds stg_orders for
          order-level reporting and customer order history summaries.
          Includes cancelled and deleted orders.
        columns:
          - name: id
            description: Primary key for the orders table.
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            data_tests:
              - not_null
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
