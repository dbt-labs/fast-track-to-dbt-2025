sources:
  - name: jaffle_shop
    description: >-
      Replica of the application's Postgres database, stored in raw.jaffle_shop.
      Provides customer and order records for the staging models and downstream
      customer and order reporting.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: >-
          One record per customer in the application, containing the customer
          identifier and name. Used by stg_customers as the customer reference
          for downstream order reporting.
        columns:
          - name: id
            description: Unique customer identifier in the application; primary key of this table and referenced by orders.user_id.
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer's first name as recorded in the application; passed through by stg_customers.
          - name: last_name
            description: Customer's last name as recorded in the application; passed through by stg_customers.
      - name: orders
        description: >-
          One record per order in the application, including its customer,
          order date, and status. Includes cancelled and deleted orders.
          Used by stg_orders for downstream order detail and customer order summaries.
        columns:
          - name: id
            description: Unique order identifier in the application; primary key of this table and renamed to order_id in stg_orders.
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Identifier of the customer associated with the order; references customers.id and is renamed to customer_id in stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Order date recorded in the application; used downstream to calculate each customer's first and most recent order dates.
            data_tests:
              - not_null
          - name: status
            description: >-
              Order status recorded in the application. Expected values, as
              defined by the accepted-values test, are placed, shipped,
              completed, return_pending, and returned.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
